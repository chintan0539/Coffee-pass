<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Pass · 2-minute survey</title>
<meta name="description" content="A few quick questions to help us build something new for Bengaluru’s independent cafés.">
<meta property="og:type" content="website">
<meta property="og:title" content="Coffee Pass · 2-minute survey">
<meta property="og:description" content="A few quick questions to help us build something new for Bengaluru’s independent cafés.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236f4429'/%3E%3Cpath d='M8 13h13v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M21 14h1.5a2.8 2.8 0 0 1 0 5.6H21' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --text: #1d1d1f;
    --text-2: #6b6b70;
    --line: #e4e0da;
    --line-strong: #8e8a85;
    --track: #ebe6df;
    --accent: #6f4429;          /* espresso */
    --accent-strong: #5a361f;
    --on-accent: #ffffff;
    --accent-soft: rgba(111, 68, 41, 0.07);
    --accent-ring: rgba(111, 68, 41, 0.22);
    --accent-ring-0: rgba(111, 68, 41, 0);
    --error: #b42318;
    --bar-bg: rgba(250, 249, 247, 0.8);
    --shadow-sel: 0 8px 24px -12px rgba(111, 68, 41, 0.55);
    --glow-1: rgba(214, 150, 92, 0.34);
    --glow-2: rgba(111, 68, 41, 0.16);
    --shimmer: #d39a62;
    --radius: 14px;
    --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1);
    --ease-in: cubic-bezier(0.4, 0, 1, 1);
    --font: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --surface: #1c1c1e;
      --text: #f5f5f7;
      --text-2: #a1a1a6;
      --line: #2c2c2e;
      --line-strong: #76767c;
      --track: #2c2c2e;
      --accent: #d9a46c;        /* caramel */
      --accent-strong: #e6b886;
      --on-accent: #1d1d1f;
      --accent-soft: rgba(217, 164, 108, 0.1);
      --accent-ring: rgba(217, 164, 108, 0.3);
      --accent-ring-0: rgba(217, 164, 108, 0);
      --error: #ff7b72;
      --bar-bg: rgba(0, 0, 0, 0.72);
      --shadow-sel: 0 8px 28px -14px rgba(217, 164, 108, 0.6);
      --glow-1: rgba(217, 164, 108, 0.2);
      --glow-2: rgba(150, 95, 55, 0.22);
      --shimmer: #f6e2c8;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    background: var(--bg);
    scroll-padding-top: 24px;
    scroll-padding-bottom: 120px;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  button, input { font: inherit; color: inherit; }

  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0);
    white-space: nowrap; border: 0;
  }

  /* ---------- Layout ---------- */
  main {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    padding: 0 20px;
  }
  .column {
    width: 100%;
    max-width: 600px;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    padding-top: calc(env(safe-area-inset-top) + clamp(36px, 9vh, 104px));
  }
  body[data-view="intro"] .column,
  body[data-view="done"] .column {
    max-width: 760px;
    padding-top: 0;
  }
  .stage { flex: 1 0 auto; }
  @media (min-width: 640px) {
    .stage { flex: 0 0 auto; }
  }

  .actions {
    position: sticky;
    bottom: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 28px;
    padding: 16px 0 calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 62%, transparent);
  }
  .kbd-hint { display: none; margin-left: auto; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
  .kbd-hint kbd {
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 2px 7px;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
  }
  @media (hover: hover) and (min-width: 640px) { .kbd-hint { display: inline-flex; } }
  @media (min-width: 640px) {
    .actions { margin-top: 40px; padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
  }

  /* ---------- Buttons ---------- */
  .btn {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    margin: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform 0.15s var(--ease-out), background-color 0.2s var(--ease-out), color 0.2s var(--ease-out);
  }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .btn-primary {
    min-height: 50px;
    min-width: 128px;
    padding: 0 28px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .btn-lg { min-height: 56px; min-width: 168px; padding: 0 40px; font-size: 18px; }

  .btn-ghost {
    min-height: 44px;
    padding: 0 14px 0 8px;
    border-radius: 999px;
    background: transparent;
    color: var(--text-2);
    font-size: 17px;
    font-weight: 500;
  }
  .btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .btn-link {
    min-height: 44px;
    padding: 0 12px;
    background: transparent;
    color: var(--text-2);
    font-size: 15px;
    font-weight: 500;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
  }

  @media (hover: hover) {
    .btn-primary:hover { background: var(--accent-strong); }
    .btn-ghost:hover, .btn-link:hover { color: var(--text); }
    .btn-ghost:hover { background: var(--accent-soft); }
  }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 64px 0 48px;
  }
  .glow-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    transition: opacity 0.4s var(--ease-out);
  }
  body[data-view="step"] .glow-layer { opacity: 0; }

  /* Drifting coffee beans behind the intro and thank-you screens */
  .beans {
    position: absolute;
    inset: 0;
    transform: translate(calc(var(--px, 0) * -28px), calc(var(--py, 0) * -28px));
    transition: transform 0.8s var(--ease-out);
  }
  .bean {
    position: absolute;
    left: var(--x);
    bottom: -60px;
    width: var(--s);
    height: calc(var(--s) * 1.4);
    color: var(--accent);
    opacity: var(--o);
  }
  .bean:nth-child(3n) { filter: blur(1.5px); }
  .bean svg { display: block; width: 100%; height: 100%; }
  .bean-crease { fill: none; stroke: var(--bg); stroke-width: 1.6; stroke-linecap: round; opacity: 0.6; }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto 0;
    height: 60vh;
    background: radial-gradient(70% 60% at 50% 0%, var(--accent-soft), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .glow {
    position: absolute;
    left: 50%;
    top: 46%;
    width: min(980px, 150vw);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background:
      radial-gradient(38% 38% at 40% 44%, var(--glow-1), transparent 72%),
      radial-gradient(34% 34% at 62% 58%, var(--glow-2), transparent 72%);
    filter: blur(24px);
  }
  .hero .eyebrow { margin-bottom: 14px; font-size: 17px; }
  .hero-concept {
    margin: 0 auto;
    max-width: 28ch;
    font-size: clamp(1.625rem, 1.1rem + 2.4vw, 2.75rem);
    line-height: 1.12;
    letter-spacing: -0.03em;
    font-weight: 700;
    text-wrap: balance;
  }
  .hero-concept .accent { color: var(--accent); }
  .hero-concept .wd { display: inline-block; }
  .hero-concept .shimmer {
    white-space: nowrap;
    background: linear-gradient(100deg, var(--accent) 20%, var(--shimmer) 45%, var(--accent) 70%);
    background-size: 250% 100%;
    background-position: 100% 0;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero-visual {
    position: relative;
    margin-bottom: 44px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .hero-visual .sparkle { width: 16px; height: 16px; }

  .perks {
    list-style: none;
    margin: 24px auto 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: 34rem;
  }
  .perk {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px 8px 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 6px 16px -12px rgba(0, 0, 0, 0.3);
  }
  /* Phones: compact intro so the Start button fits on the first screen. */
  @media (max-width: 480px) {
    .hero:not(.done) { padding-top: 20px; padding-bottom: 32px; }
    .hero-visual { margin-bottom: 22px; }
    .pass.hero-pass { width: min(250px, 66vw); }
    .hero-visual .pass-card { padding: 14px 16px 12px; border-radius: 16px; }
    .hero .eyebrow { margin-bottom: 8px; font-size: 15px; }
    .hero .hero-concept { font-size: 1.5rem; line-height: 1.13; }
    .perks { margin-top: 14px; gap: 6px; }
    .perk { gap: 6px; padding: 6px 12px 6px 9px; font-size: 13px; }
    .hero .hero-cta { margin-top: 22px; }
    .hero .hero-cta .btn-lg { min-height: 52px; }
    /* The supporting line moves below Start (it stays first in reading order). */
    .hero .hero-meta { order: 1; }
    .hero .hero-lede { order: 2; margin-top: 12px; font-size: 1rem; }
    .hero .hero-privacy, .hero .preview-note { order: 3; }
  }
  .perk svg { width: 17px; height: 17px; fill: none; stroke: var(--accent); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  .btn-start { position: relative; overflow: hidden; isolation: isolate; }
  .btn-shine {
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.35) 50%, transparent 70%);
    transform: translateX(-120%);
    pointer-events: none;
  }
  .clock-hand { transform-box: view-box; transform-origin: 12px 12px; }
  .hero-title {
    margin: 0;
    max-width: 18ch;
    font-size: clamp(2.5rem, 1.6rem + 4vw, 4rem);
    line-height: 1.04;
    letter-spacing: -0.035em;
    font-weight: 700;
    text-wrap: balance;
  }
  .hero-lede {
    margin: 20px auto 0;
    max-width: 36ch;
    font-size: clamp(1.125rem, 1rem + 0.6vw, 1.375rem);
    line-height: 1.45;
    color: var(--text-2);
    text-wrap: pretty;
  }
  .hero-lede + .hero-lede { margin-top: 8px; }
  .hero-cta {
    margin-top: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .hero-meta {
    margin: 14px 0 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    color: var(--text-2);
  }
  .hero-meta svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
  .hero-privacy {
    margin: 40px auto 0;
    max-width: 36ch;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-2);
  }
  .preview-note {
    margin: 12px auto 0;
    max-width: 40ch;
    font-size: 12px;
    color: var(--text-2);
    border: 1px dashed var(--line-strong);
    border-radius: 10px;
    padding: 6px 12px;
  }

  /* ---------- Questions ---------- */
  .eyebrow {
    margin: 0 0 12px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.005em;
    color: var(--accent);
  }
  .q-title {
    margin: 0;
    font-size: clamp(2rem, 1.35rem + 2.6vw, 3rem);
    line-height: 1.08;
    letter-spacing: -0.028em;
    font-weight: 700;
    text-wrap: balance;
  }
  h1:focus { outline: none; }
  .q-sub {
    margin: 14px 0 0;
    font-size: clamp(1.0625rem, 1rem + 0.4vw, 1.25rem);
    line-height: 1.5;
    color: var(--text-2);
    text-wrap: pretty;
  }
  .q-hint {
    margin: 12px 0 0;
    font-size: 15px;
    color: var(--text-2);
  }

  .options {
    display: grid;
    gap: 10px;
    margin-top: 28px;
  }
  .option {
    position: relative;
    display: block;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .option input {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    margin: 0;
    pointer-events: none;
  }
  .option-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 58px;
    padding: 14px 16px 14px 20px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    font-weight: 500;
    line-height: 1.35;
    transition:
      background-color 0.22s var(--ease-out),
      border-color 0.22s var(--ease-out),
      color 0.22s var(--ease-out),
      box-shadow 0.22s var(--ease-out),
      transform 0.15s var(--ease-out);
  }
  @media (hover: hover) {
    .option:hover .option-card {
      border-color: var(--line-strong);
      transform: translateY(-1px);
      box-shadow: 0 8px 18px -14px rgba(0, 0, 0, 0.35);
    }
  }
  .option:active .option-card { transform: scale(0.985); }
  .option input:checked + .option-card {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
    box-shadow: var(--shadow-sel);
  }
  .option input:focus-visible + .option-card {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .indicator {
    flex: none;
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    border: 1.5px solid var(--line-strong);
    border-radius: 50%;
    transition: background-color 0.22s var(--ease-out), border-color 0.22s var(--ease-out);
  }
  .indicator.checkbox { border-radius: 7px; }
  .indicator svg {
    width: 16px; height: 16px;
    opacity: 0;
    transition: opacity 0.15s var(--ease-out);
    fill: none;
    stroke: var(--accent);
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .indicator path {
    stroke-dasharray: 18;
    stroke-dashoffset: 18;
    transition: stroke-dashoffset 0.3s var(--ease-out) 0.05s;
  }
  .option input:checked + .option-card .indicator {
    background: var(--on-accent);
    border-color: var(--on-accent);
  }
  .option input:checked + .option-card .indicator svg { opacity: 1; }
  .option input:checked + .option-card .indicator path { stroke-dashoffset: 0; }

  .other { margin-top: 10px; }

  /* ---------- Text fields ---------- */
  .fields { display: grid; gap: 20px; margin-top: 28px; }
  /* Phone-or-email group */
  .reach {
    margin: 0;
    min-width: 0;
    padding: 18px 16px 18px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--accent-soft);
  }
  .reach legend {
    float: left;
    width: 100%;
    padding: 0;
    font-size: 15px;
    font-weight: 600;
  }
  .reach-hint { clear: both; margin: 2px 0 16px; font-size: 14px; color: var(--text-2); }
  .or {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 14px 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-2);
  }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .reach .field label { font-weight: 500; font-size: 14px; }
  .field label {
    display: block;
    margin-bottom: 8px;
    font-size: 15px;
    font-weight: 600;
  }
  .input {
    width: 100%;
    min-height: 54px;
    padding: 14px 16px;
    font-size: 17px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    -webkit-appearance: none;
    appearance: none;
    transition: border-color 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out);
  }
  .input::placeholder { color: var(--text-2); opacity: 1; }
  @media (hover: hover) { .input:hover { border-color: var(--line-strong); } }
  .input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-ring);
  }
  .input[aria-invalid="true"] { border-color: var(--error); }
  .input[aria-invalid="true"]:focus { box-shadow: 0 0 0 4px color-mix(in srgb, var(--error) 22%, transparent); }

  .phone { position: relative; }
  .phone-prefix {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 17px;
    font-weight: 500;
    pointer-events: none;
  }
  .phone-prefix::after {
    content: "";
    position: absolute;
    right: -12px;
    top: 1px;
    bottom: 1px;
    width: 1px;
    background: var(--line);
  }
  .phone .input { padding-left: 66px; }

  .error {
    margin: 0;
    font-size: 15px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--error);
  }
  .error:not(:empty) { margin-top: 12px; }
  .field .error:not(:empty) { margin-top: 8px; }

  /* ---------- Coffee Pass card ---------- */
  .pass { width: min(300px, 76vw); margin: 0 auto; perspective: 1000px; }

  .pass-in { transform-style: preserve-3d; }
  .pass-card {
    --rx: 0deg;
    --ry: 0deg;
    position: relative;
    aspect-ratio: 1.586;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 18px 20px 16px;
    border-radius: 20px;
    overflow: hidden;
    color: #fbf3e8;
    text-align: left;
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(232, 178, 116, 0.55), transparent 55%),
      radial-gradient(90% 80% at 0% 100%, rgba(30, 16, 8, 0.6), transparent 60%),
      linear-gradient(135deg, #4a2c1a 0%, #6f4429 52%, #8d5a35 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.2),
      inset 0 0 0 1px rgba(255, 255, 255, 0.07),
      0 30px 60px -24px rgba(60, 30, 10, 0.55),
      0 12px 24px -14px rgba(60, 30, 10, 0.4);
    transform: rotateX(var(--rx)) rotateY(var(--ry));
    transition: transform 0.5s var(--ease-out);
  }
  @media (prefers-color-scheme: dark) {
    .pass-card {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        inset 0 0 0 1px rgba(255, 255, 255, 0.1),
        0 30px 70px -20px rgba(217, 164, 108, 0.3);
    }
  }
  .pass-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pass-brand { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .pass-chip {
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;

  /* ---------- Motion (only when the user hasn't asked for less) ---------- */

    .hero-visual .sparkle { opacity: 0; animation: twinkle 2.6s ease-in-out infinite; animation-delay: var(--d); }
    .hero-visual.tapped .pass-card { animation: tap-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .btn-start { animation: btn-glow 2.4s ease-out 2.2s infinite; }

    .pass { animation: float 6s ease-in-out infinite; }

    .pass-shine { animation: shine 5.5s ease-in-out 1.4s infinite; }

    .done .ring { animation: ring 3s var(--ease-out) infinite; }

    .done .ring.r2 { animation-delay: 1.5s; }

    .done .steam path { opacity: 0; animation: steam 2.6s ease-in-out 1.3s infinite; }
    .done .steam path:nth-child(2) { animation-delay: 1.75s; }

    .done .badge { animation: badge-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 1.3s both; }
    .done .badge path { stroke-dasharray: 18; stroke-dashoffset: 18; animation: draw 0.4s var(--ease-out) 1.6s forwards; }
    .done .sparkle { opacity: 0; animation: twinkle 2.4s ease-in-out infinite; animation-delay: var(--d); }
    .done .ch { animation: letter 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.3) both; animation-delay: calc(var(--i) * 45ms + 0.5s); }
    .done .hero-lede { animation: rise 0.6s var(--ease-out) 1s both; }
    .done-pass .pass-in { animation: flip-in 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) 1.3s both; }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  }

<body data-view="intro">

  <main>
    <form class="column" id="survey" novalidate>
      <div class="stage" id="stage"></div>
      <div class="actions" id="actions" hidden>
        <button class="btn btn-ghost" id="back" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 6l-6 6 6 6"/></svg>
          Back
        </button>

  </main>

  <noscript><p>This survey needs JavaScript. Please enable it and reload the page.</p></noscript>

<script>
(() => {
  'use strict';

  /* =========================================================
     Configuration
     ========================================================= */
  const CONFIG = {
    // Paste your Google Apps Script web app URL here (see ../README.md).
    // While it's empty, responses are only kept in this browser (for testing).
    submitUrl: 'https://script.google.com/macros/s/AKfycbzy32QRTh4sZ9IbnHCCtf8ElgTontT9-1siUx0EGbpuIdXwsvc98P_ESGgqS742UjKUEA/exec',
    autoAdvanceDelay: 450,
    resumeMaxAgeDays: 30,
    storageKey: 'coffeepass:survey:v1',
    outboxKey: 'coffeepass:outbox:v1',
    localResponsesKey: 'coffeepass:responses:v1',
  };

  /* =========================================================
     Survey content, from Form/formQuestions.md
     ========================================================= */
  const STEPS = [
    { id: 'contact', type: 'contact', title: 'How can we reach you?', sub: 'We need your name, plus a phone number or an email.' },
    { id: 'age', type: 'single', title: 'What is your age?',
      options: ['Under 18', '18–24', '25–30', '31–40', 'Over 40'] },
    { id: 'occupation', type: 'single', title: 'What is your current occupation?',
      options: ['Student', 'Working professional', 'Business owner', 'Freelancer', 'Other'] },
    { id: 'area', type: 'single', title: 'In which area of Bengaluru do you spend most of your weekdays?',
      options: ['Indiranagar', 'Koramangala', 'HSR Layout', 'Whitefield', 'Other'] },
    { id: 'coffee_frequency', type: 'single', title: 'How often do you drink coffee?',
      options: ['Daily', 'A few times a week', 'Occasionally', { label: 'I don’t drink coffee', endsSurvey: true }] },
    { id: 'cafe_frequency', type: 'single', title: 'How often do you buy coffee from a café?',
      options: ['Daily', 'A few times a week', 'Once a week', 'A few times a month', 'Rarely'] },
    { id: 'monthly_spend', type: 'single', title: 'Roughly how much do you spend on café coffee each month?',
      options: ['Under ₹500', '₹500–1,000', '₹1,000–2,000', '₹2,000–3,000', '₹3,000–5,000', 'Over ₹5,000'] },
    { id: 'interest', type: 'single', title: 'Would you be interested in Coffee Pass?',
      options: ['Yes', 'Maybe', 'No'] },
    { id: 'usage', type: 'single', title: 'How would you prefer to use Coffee Pass?',
      options: ['Visiting partner cafés', 'Delivery to my home or office (at a higher price)'] },
    { id: 'max_price', type: 'single', title: 'What is the most you would pay per month for Coffee Pass?',
      options: ['₹3,000', '₹4,000', '₹4,500', '₹5,000', 'Over ₹5,000'] },
    { id: 'waitlist', type: 'consent', eyebrow: 'Optional', title: 'Would you like to join the waitlist?',
      sub: 'Waitlist members will get an exclusive launch discount.',
      checkbox: 'I agree to be contacted about Coffee Pass' },
  ];
  let questionCount = 0;
  STEPS.forEach((s) => {
    if (s.options) s.opts = s.options.map((o) => (typeof o === 'string' ? { label: o } : o));
    if (s.options || s.type === 'consent') s.num = ++questionCount;
  });
  // Shown on the intro screen.
  const CONCEPT = {
    highlight: 'Coffee Pass',
    text: 'Coffee Pass is a monthly subscription that gives you a set number of coffees at 20+ partner cafés across Bengaluru.',
  };

  const MSG = {
    single: 'Please choose an option to continue.',
    multi: 'Please choose at least one option to continue.',
    other: 'Please tell us a little more to continue.',
    phone: 'Please enter a valid 10-digit mobile number.',
    email: 'That email doesn’t look quite right. Mind checking it?',
    reach: 'Please enter a phone number or an email.',
    name: 'Please enter your name.',
  };

  /* =========================================================
     Helpers
     ========================================================= */
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const trim = (v) => (v == null ? '' : String(v).trim());
  const uid = () => (window.crypto && crypto.randomUUID
    ? crypto.randomUUID()
    : 'r-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10));

  const store = {
    get(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* storage unavailable */ } },
    del(key) { try { localStorage.removeItem(key); } catch (e) { /* storage unavailable */ } },
  };

  const PHONE_RE = /^[6-9]\d{9}$/;
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  function normPhone(v) {
    let d = String(v || '').replace(/\D/g, '');
    if (d.length === 14 && d.startsWith('0091')) d = d.slice(4);
    else if (d.length === 12 && d.startsWith('91')) d = d.slice(2);
    else if (d.length === 11 && d.startsWith('0')) d = d.slice(1);
    return d;
  }
  const phoneOk = (v) => PHONE_RE.test(normPhone(v));
  const emailOk = (v) => EMAIL_RE.test(trim(v));
  const fmtPhone = (d) => (d.length === 10 ? d.slice(0, 5) + ' ' + d.slice(5) : d);

  const otherLabel = (s) => (s.opts.find((o) => o.other) || {}).label;
  function otherSelected(s, v = state.answers[s.id]) {
    const l = otherLabel(s);
    return !!l && (Array.isArray(v) ? v.includes(l) : v === l);
  }
  function endsSurvey(s) {
    const v = state.answers[s.id];
    return !!s.opts && s.opts.some((o) => o.endsSurvey && o.label === v);
  }

  function readSource() {
    const p = new URLSearchParams(location.search);
    return trim(p.get('utm_source') || p.get('src') || p.get('ref')).slice(0, 60);
  }

  const ICON_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.5 12.5l3.6 3.6L17.5 8.5"/></svg>';
  const ICON_CUP = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 9h11v4a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/></svg>';
  const ICON_SHARE = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>';
  const SPARKLE = '<svg viewBox="0 0 24 24"><path d="M12 0l2.5 9.5L24 12l-9.5 2.5L12 24l-2.5-9.5L0 12l9.5-2.5z"/></svg>';
  const CUP_SVG = `
    <svg class="cup" viewBox="0 0 132 124" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="coffee-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8d5a35"/><stop offset="1" stop-color="#3b2416"/>
        </linearGradient>
        <clipPath id="cup-clip"><path d="M14 46H106V68C106 92 86 108 60 108C34 108 14 92 14 68Z"/></clipPath>
      </defs>
      <ellipse class="saucer" cx="60" cy="114" rx="54" ry="7"/>
      <path class="cup-body" d="M14 46H106V68C106 92 86 108 60 108C34 108 14 92 14 68Z"/>
      <g clip-path="url(#cup-clip)">
        <g class="coffee">
          <rect x="8" y="54" width="104" height="60" fill="url(#coffee-grad)"/>
          <ellipse class="crema" cx="60" cy="54" rx="48" ry="4"/>
        </g>
      </g>
      <path class="cup-line" d="M14 46H106V68C106 92 86 108 60 108C34 108 14 92 14 68Z"/>
      <path class="cup-line" d="M106 56C124 56 126 84 104 86"/>
      <g class="steam">
        <path d="M44 36c-5-6 5-10 0-16s5-10 0-16"/>
        <path d="M60 38c-5-6 5-10 0-16s5-10 0-16"/>
        <path d="M76 36c-5-6 5-10 0-16s5-10 0-16"/>
      </g>
    </svg>`;
  const ICON_CLOCK = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path class="clock-hand" d="M12 7.5V12l3 2"/></svg>';
  const ICON_ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>';
  const ICON_CALENDAR = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>';
  const ICON_PIN = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>';
  const BEAN_SVG = '<svg viewBox="0 0 20 28"><ellipse cx="10" cy="14" rx="9" ry="13" fill="currentColor"/><path class="bean-crease" d="M10 2.5c-4 4-4 7.5 0 11.5s4 7.5 0 11.5"/></svg>';

  /* =========================================================
     State (saved to this device so people can resume)
     ========================================================= */
  function freshState() {
    return { id: uid(), view: 'intro', step: 0, answers: {}, startedAt: null, updatedAt: null, source: readSource(), done: null };
  }
  function loadState() {
    const saved = store.get(CONFIG.storageKey);
    if (!saved || typeof saved !== 'object' || !saved.id || !saved.answers) return freshState();
    const ageDays = (Date.now() - (saved.updatedAt || 0)) / 864e5;
    if (!saved.done && ageDays > CONFIG.resumeMaxAgeDays) return freshState();
    if (!saved.source) saved.source = readSource();
    saved.step = Math.min(Math.max(0, saved.step | 0), STEPS.length - 1);
    return saved;
  }
  let state = loadState();
  let doneName = ''; // shown on the waitlist card; kept in memory only
  let shareName = ''; // respondent's name, used as ?src= on the share link; memory only

  function save() {
    state.updatedAt = Date.now();
    store.set(CONFIG.storageKey, state);
  }
  let saveTimer;
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 250); }

  const hasProgress = () => state.step > 0 || Object.keys(state.answers).length > 0;
  const currentStep = () => (state.view === 'step' ? STEPS[state.step] : null);

  /* =========================================================
     Screen templates
     ========================================================= */
  function passHTML(cls, o = {}) {
    const filled = o.filled == null ? 5 : o.filled;
    const cups = Array.from({ length: 8 }, (_, i) => `<span class="pass-cup${i < filled ? ' on' : ''}" style="--i:${i}">${ICON_CUP}</span>`).join('');
    return `
      <div class="pass ${cls}" aria-hidden="true"><div class="pass-in"><div class="pass-card">
        <div class="pass-row"><span class="pass-brand">Coffee Pass</span><span class="pass-chip">${esc(o.chip || 'Bengaluru')}</span></div>
        <div class="pass-cups">${cups}</div>
        <div class="pass-meta">
          <span>${esc(o.leftLabel || 'Partner cafés')}<strong>${esc(o.left || '20+')}</strong></span>
          <span>${esc(o.rightLabel || 'Plan')}<strong>${esc(o.right || 'Monthly')}</strong></span>
        </div>
        <span class="pass-shine"></span>
      </div></div></div>`;
  }

  // The concept sentence split into words, so it can be revealed one word at a time.
  function conceptWordsHTML(s) {
    const lead = s.highlight && s.text.startsWith(s.highlight) ? s.highlight : '';
    let i = 0;
    const words = [];
    if (lead) words.push(`<span class="wd accent shimmer" style="--i:${i++}">${esc(lead)}</span>`);
    s.text.slice(lead.length).trim().split(/\s+/).forEach((w) => words.push(`<span class="wd" style="--i:${i++}">${esc(w)}</span>`));
    return words.join(' ');
  }

  function introHTML() {
    const resume = hasProgress();
    const sparkles = [['0.2s', '-4%', '8%'], ['1.1s', '96%', '-6%'], ['0.7s', '100%', '70%'], ['1.6s', '-6%', '84%']]
      .map(([d, l, t]) => `<span class="sparkle" style="--d:${d};left:${l};top:${t}">${SPARKLE}</span>`).join('');
    return `
      <div class="hero-visual" data-action="burst-card" aria-hidden="true">
        ${passHTML('hero-pass')}
        ${sparkles}
      </div>
      <p class="eyebrow">What is Coffee Pass?</p>
      <h1 class="hero-concept" tabindex="-1">${conceptWordsHTML(CONCEPT)}</h1>
      <ul class="perks" role="list">
        <li class="perk" style="--i:0">${ICON_CALENDAR}Monthly plan</li>
        <li class="perk" style="--i:1">${ICON_PIN}20+ partner cafés</li>
        <li class="perk" style="--i:2">${ICON_CUP}A set number of coffees</li>
      </ul>
      <p class="hero-lede">Help us shape it. A few quick questions about how you drink your coffee.</p>
      <div class="hero-cta">
        <button class="btn btn-primary btn-lg btn-start" type="button" data-action="start"><span>${resume ? 'Continue' : 'Start'}</span>${ICON_ARROW}<span class="btn-shine" aria-hidden="true"></span></button>
        ${resume ? '<button class="btn btn-link" type="button" data-action="restart">Start over</button>' : ''}
      </div>
      <p class="hero-meta">${ICON_CLOCK}Takes about 2 minutes</p>
      <p class="hero-privacy">Your answers are used only for this research.</p>
      ${CONFIG.submitUrl ? '' : '<p class="preview-note">Preview mode: responses stay in this browser until <code>submitUrl</code> is set.</p>'}`;
  }

  function doneHTML() {
    const waitlist = !!(state.done && state.done.waitlist);
    const title = 'Thank you!';
    let n = 0;
    const letters = title.split(' ')
      .map((w) => `<span class="w">${Array.from(w).map((c) => `<span class="ch" style="--i:${n++}">${esc(c)}</span>`).join('')}</span>`)
      .join(' ');
    const sparkles = [
      ['0s', '4%', '30%'], ['0.6s', '86%', '8%'], ['1.1s', '90%', '62%'], ['1.7s', '10%', '78%'], ['0.9s', '46%', '-4%'],
    ].map(([d, l, t]) => `<span class="sparkle" style="--d:${d};left:${l};top:${t}">${SPARKLE}</span>`).join('');
    return `
      <button type="button" class="cup-stage" data-action="burst" aria-label="Celebrate again">
        <span class="halo"></span><span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
        ${sparkles}
        ${CUP_SVG}
        <span class="badge">${ICON_CHECK}</span>
      </button>
      <h1 class="done-title" tabindex="-1" aria-label="${title}"><span aria-hidden="true">${letters}</span></h1>
      <p class="hero-lede">Your answers will help shape Coffee Pass.</p>
      ${waitlist ? `
        ${passHTML('done-pass', { chip: 'Waitlist', leftLabel: 'Member', left: doneName || 'You', rightLabel: 'Perk', right: 'Launch discount', filled: 8 })}
        <p class="hero-lede">You’re on the waitlist. Look out for your exclusive launch discount.</p>` : ''}
      <div class="done-actions">
        <button type="button" class="btn btn-primary btn-lg" data-action="share">${ICON_SHARE}Share with a friend</button>
        <p class="done-note">Know someone who runs on coffee? Send them the survey.</p>
      </div>`;
  }

  function headHTML(s) {
    const eyebrow = [s.num && `Question ${s.num} of ${questionCount}`, s.eyebrow].filter(Boolean).join(' · ');
    return `
      ${eyebrow ? `<p class="eyebrow">${esc(eyebrow)}</p>` : ''}
      <h1 class="q-title" id="t-${s.id}" tabindex="-1">${esc(s.title)}</h1>
      ${s.sub ? `<p class="q-sub" id="s-${s.id}">${esc(s.sub)}</p>` : ''}
      ${s.hint ? `<p class="q-hint" id="h-${s.id}">${esc(s.hint)}</p>` : ''}`;
  }

  function optionHTML(s, o, i, kind) {
    const attrs = [o.other && 'data-other', o.exclusive && 'data-exclusive', o.endsSurvey && 'data-ends'].filter(Boolean).join(' ');
    return `
      <label class="option" style="--i:${i}">
        <input type="${kind}" name="${s.id}" id="${s.id}-${i}" value="${esc(o.label)}" ${attrs}>
        <span class="option-card">
          <span class="option-label">${esc(o.label)}</span>
          <span class="indicator ${kind}" aria-hidden="true">${ICON_CHECK}</span>
        </span>
      </label>`;
  }

  function choiceHTML(s) {
    const multi = s.type === 'multi';
    const kind = multi ? 'checkbox' : 'radio';
    const describedBy = [s.hint && `h-${s.id}`, `e-${s.id}`].filter(Boolean).join(' ');
    const other = otherLabel(s);
    return `
      ${headHTML(s)}
      <div class="options" role="${multi ? 'group' : 'radiogroup'}" aria-labelledby="t-${s.id}" aria-describedby="${describedBy}"${multi ? '' : ' aria-required="true"'}>
        ${s.opts.map((o, i) => optionHTML(s, o, i, kind)).join('')}
      </div>
      ${other ? `
        <div class="other" id="${s.id}-other-wrap" hidden>
          <label class="sr-only" for="${s.id}-other">${esc(other)}: please specify</label>
          <input class="input" type="text" id="${s.id}-other" data-other-text maxlength="120" placeholder="Please specify" autocomplete="off" aria-describedby="e-${s.id}">
        </div>` : ''}
      <p class="error" id="e-${s.id}" aria-live="polite"></p>`;
  }

  function contactFieldsHTML(p) {
    return `
      <div class="fields">
        <div class="field">
          <label for="${p}-name">Name</label>
          <input class="input" id="${p}-name" data-field="name" type="text" autocomplete="name" autocapitalize="words" maxlength="80" required aria-describedby="${p}-name-err">
          <p class="error" id="${p}-name-err" aria-live="polite"></p>
        </div>
        <fieldset class="reach" aria-describedby="${p}-reach-hint e-contact">
          <legend>Phone number or email</legend>
          <p class="reach-hint" id="${p}-reach-hint">Fill in at least one. Both is fine too.</p>
          <div class="field">
            <label for="${p}-phone">Phone number</label>
            <div class="phone">
              <span class="phone-prefix" aria-hidden="true">+91</span>
              <input class="input" id="${p}-phone" data-field="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="16" placeholder="XXXXX XXXXX" aria-describedby="${p}-phone-err">
            </div>
            <p class="error" id="${p}-phone-err" aria-live="polite"></p>
          </div>
          <div class="or" aria-hidden="true"><span>or</span></div>
          <div class="field">
            <label for="${p}-email">Email</label>
            <input class="input" id="${p}-email" data-field="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" maxlength="120" placeholder="you@example.com" aria-describedby="${p}-email-err">
            <p class="error" id="${p}-email-err" aria-live="polite"></p>
          </div>
          <p class="error" id="e-contact" aria-live="polite"></p>
        </fieldset>
      </div>`;
  }

  function consentHTML(s) {
    return `
      ${headHTML(s)}
      <div class="options">
        <label class="option" style="--i:0">
          <input type="checkbox" id="waitlist-consent" data-consent aria-describedby="s-${s.id} e-${s.id}">
          <span class="option-card">
            <span class="option-label">${esc(s.checkbox)}</span>
            <span class="indicator checkbox" aria-hidden="true">${ICON_CHECK}</span>
          </span>
        </label>
      </div>
      <p class="error" id="e-${s.id}" aria-live="polite"></p>`;
  }

  function buildScreen(target) {
    const el = document.createElement('section');
    el.className = 'screen';
    if (target.view === 'intro') {
      el.classList.add('hero');
      el.innerHTML = introHTML();
      return el;
    }
    if (target.view === 'done') {
      el.classList.add('hero', 'done');
      el.innerHTML = doneHTML();
      return el;
    }
    const s = STEPS[target.step];
    el.dataset.step = s.id;
    el.innerHTML = s.type === 'contact' ? headHTML(s) + contactFieldsHTML('c')
      : s.type === 'consent' ? consentHTML(s)
      : choiceHTML(s);
    hydrate(el, s);
    return el;
  }

  // Put saved answers back into a freshly built screen.
  function hydrate(el, s) {
    const a = state.answers;
    if (s.opts) {
      const v = a[s.id];
      $$(`input[name="${s.id}"]`, el).forEach((inp) => {
        inp.checked = Array.isArray(v) ? v.includes(inp.value) : v === inp.value;
      });
      const other = $('[data-other-text]', el);
      if (other) other.value = a[s.id + '_other'] || '';
      syncOther(el, s);
    }
    $$('[data-field]', el).forEach((inp) => {
      const v = a[inp.dataset.field] || '';
      inp.value = inp.dataset.field === 'phone' && phoneOk(v) ? fmtPhone(normPhone(v)) : v;
    });
    const consent = $('[data-consent]', el);
    if (consent) {
      consent.checked = !!a.waitlist_consent;
    }
  }

  function syncOther(el, s) {
    const wrap = $(`#${s.id}-other-wrap`, el);
    if (wrap) wrap.hidden = !otherSelected(s);
  }

  /* =========================================================
     Rendering + transitions
     ========================================================= */
  const stage = $('#stage');
  const actions = $('#actions');
  const backBtn = $('#back');
  const nextBtn = $('#next');
  const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  const reducedMotion = () => motionQuery.matches;

  let renderToken = 0;
  let transitioning = false;
  let advanceTimer = null;

  async function render(target, dir) {
    const token = ++renderToken;
    clearTimeout(advanceTimer);
    state.view = target.view;
    if (target.view === 'step') state.step = target.step;
    save();

    const old = stage.firstElementChild;
    const animate = !!(old && dir && !reducedMotion() && old.animate);
    transitioning = true;
    if (animate) {
      old.style.pointerEvents = 'none';
      try {
        await old.animate(
          [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${-dir * 16}px)` }],
          { duration: 160, easing: 'cubic-bezier(0.4, 0, 1, 1)', fill: 'forwards' }
        ).finished;
      } catch (e) { /* animation interrupted */ }
      if (token !== renderToken) return;
    }

    const el = buildScreen(target);
    if (animate) el.classList.add('enter');
    stage.replaceChildren(el);
    window.scrollTo(0, 0);
    updateChrome();
    transitioning = false;

    if (animate) {
      el.animate(
        [{ opacity: 0, transform: `translateX(${dir * 24}px)` }, { opacity: 1, transform: 'none' }],
        { duration: 280, easing: 'cubic-bezier(0.22, 0.61, 0.36, 1)' }
      );
    }
    if (dir) {
      const heading = $('h1', el);
      if (heading) heading.focus({ preventScroll: true });
    }
    if (target.view === 'done') {
      setTimeout(() => { if (token === renderToken) burst($('.cup-stage', el)); }, dir ? 700 : 350);
    }
  }

  function updateChrome() {
    document.body.dataset.view = state.view;
    actions.hidden = state.view !== 'step';
    updateNextLabel();
  }

  function updateNextLabel() {
    const s = currentStep();
    if (!s) return;
    const a = state.answers;
    let label = 'Next';
    if (s.type === 'consent') label = 'Submit';
    else if (endsSurvey(s)) label = 'Finish';
    if (nextBtn.textContent !== label) nextBtn.textContent = label;
  }

  /* =========================================================
     Navigation (with browser history, so the phone's back
     gesture goes to the previous question)
     ========================================================= */
  let navN = 0;
  function entry(target) { return { cp: 1, n: navN, view: target.view, step: target.step }; }

  function goTo(target, dir, mode = 'push') {
    if (mode === 'push') { navN += 1; history.pushState(entry(target), ''); }
    else if (mode === 'replace') history.replaceState(entry(target), '');
    render(target, dir);
  }

  window.addEventListener('popstate', (e) => {
    const s = e.state;
    if (!s || !s.cp) return;
    if (state.view === 'done') {
      // The survey is submitted: stay on the thank-you screen.
      navN += 1;
      history.pushState(entry({ view: 'done' }), '');
      return;
    }
    const dir = s.n < navN ? -1 : 1;
    navN = s.n;
    render({ view: s.view, step: s.step }, dir);
  });

  function start() {
    if (!state.startedAt) state.startedAt = Date.now();
    const target = hasProgress() ? state.step : 0;
    // When resuming, recreate history for the earlier questions so Back steps through them.
    for (let i = 0; i < target; i++) {
      navN += 1;
      history.pushState(entry({ view: 'step', step: i }), '');
    }
    goTo({ view: 'step', step: target }, 1);
  }

  function restart() {
    state = freshState();
    state.startedAt = Date.now();
    goTo({ view: 'step', step: 0 }, 1);
  }

  function next() {
    const s = currentStep();
    if (!s || transitioning) return;
    clearTimeout(advanceTimer);
    if (!validate(s)) return;
    if (endsSurvey(s)) { finish('screened_out'); return; }
    if (state.step === STEPS.length - 1) { finish('complete'); return; }
    goTo({ view: 'step', step: state.step + 1 }, 1);
  }

  function back() {
    if (state.view !== 'step' || transitioning) return;
    clearTimeout(advanceTimer);
    if (navN > 0) { history.back(); return; }
    // Resumed session with no history to go back through.
    const target = state.step === 0 ? { view: 'intro' } : { view: 'step', step: state.step - 1 };
    goTo(target, -1, 'replace');
  }

  function scheduleAdvance() {
    clearTimeout(advanceTimer);
    const at = state.step;
    advanceTimer = setTimeout(() => {
      if (state.view === 'step' && state.step === at) next();
    }, CONFIG.autoAdvanceDelay);
  }

  /* =========================================================
     Validation
     ========================================================= */
  function setError(id, msg, input) {
    const box = document.getElementById(id);
    if (!box) return;
    box.textContent = '';
    requestAnimationFrame(() => { box.textContent = msg; });
    if (input) input.setAttribute('aria-invalid', 'true');
  }
  function clearError(id, input) {
    const box = document.getElementById(id);
    if (box) box.textContent = '';
    if (input) input.removeAttribute('aria-invalid');
  }
  function shake(node) {
    if (!node || reducedMotion()) return;
    node.classList.remove('shake');
    void node.offsetWidth;
    node.classList.add('shake');
  }

  function validate(s) {
    const el = stage.firstElementChild;
    const a = state.answers;

    if (s.opts) {
      const v = a[s.id];
      const answered = Array.isArray(v) ? v.length > 0 : !!v;
      if (!answered) {
        setError(`e-${s.id}`, MSG[s.type]);
        shake($('.options', el));
        return false;
      }
      if (otherSelected(s) && !trim(a[s.id + '_other'])) {
        const inp = $('[data-other-text]', el);
        setError(`e-${s.id}`, MSG.other, inp);
        inp.focus();
        return false;
      }
      return true;
    }

    if (s.type === 'contact') {
      const p = 'c';
      const phoneInp = $('#c-phone', el);
      const emailInp = $('#c-email', el);
      const nameInp = $('#c-name', el);
      let firstBad = null;
      if (!trim(a.name)) {
        setError(`${p}-name-err`, MSG.name, nameInp);
        firstBad = nameInp;
      }
      if (trim(a.phone) && !phoneOk(a.phone)) {
        setError(`${p}-phone-err`, MSG.phone, phoneInp);
        firstBad = phoneInp;
      }
      if (trim(a.email) && !emailOk(a.email)) {
        setError(`${p}-email-err`, MSG.email, emailInp);
        firstBad = firstBad || emailInp;
      }
      if (!trim(a.phone) && !trim(a.email)) {
        setError(`e-${s.id}`, MSG.reach);
        phoneInp.setAttribute('aria-invalid', 'true');
        emailInp.setAttribute('aria-invalid', 'true');
        firstBad = firstBad || phoneInp;
      }
      if (firstBad) { firstBad.focus(); return false; }
    }
    return true;
  }

  /* =========================================================
     Submitting
     ========================================================= */
  function buildPayload(status, upto) {
    const a = state.answers;
    const phone = phoneOk(a.phone) ? '+91' + normPhone(a.phone) : '';
    const p = {
      response_id: state.id,
      status,
      submitted_at: new Date().toISOString(),
      started_at: state.startedAt ? new Date(state.startedAt).toISOString() : '',
      source: state.source || '',
      name: trim(a.name),
      phone,
      email: emailOk(a.email) ? trim(a.email) : '',
    };
    STEPS.forEach((s, i) => {
      const asked = i <= upto;
      if (s.opts) {
        const v = asked ? a[s.id] : null;
        p[s.id] = Array.isArray(v) ? v.join('; ') : (v || '');
        if (otherLabel(s)) p[s.id + '_other'] = asked && otherSelected(s, v) ? trim(a[s.id + '_other']) : '';
      } else if (s.type === 'consent') {
        p.waitlist_consent = asked ? (a.waitlist_consent ? 'Yes' : 'No') : '';
      }
    });
    return p;
  }

  function finish(status) {
    const upto = status === 'screened_out' ? state.step : STEPS.length - 1;
    const payload = buildPayload(status, upto);
    send(payload);
    state.done = {
      status,
      at: Date.now(),
      waitlist: status === 'complete' && payload.waitlist_consent === 'Yes' && !!(payload.phone || payload.email),
    };
    doneName = trim(state.answers.name).split(/\s+/)[0].slice(0, 18);
    shareName = trim(state.answers.name).replace(/\s+/g, ' ').slice(0, 40);
    state.answers = {}; // don't keep personal details on the device once sent
    goTo({ view: 'done' }, 1, 'replace');
  }

  function queue(payload) {
    const q = store.get(CONFIG.outboxKey) || [];
    q.push(payload);
    store.set(CONFIG.outboxKey, q.slice(-20));
  }

  async function send(payload) {
    if (!CONFIG.submitUrl) {
      const list = store.get(CONFIG.localResponsesKey) || [];
      list.push(payload);
      store.set(CONFIG.localResponsesKey, list.slice(-50));
      console.info('[Coffee Pass] submitUrl is not set, so this response was only saved in this browser:', payload);
      return;
    }
    try {
      // text/plain + no-cors keeps this a "simple" request that Google Apps Script accepts.
      await fetch(CONFIG.submitUrl, {
        method: 'POST',
        mode: 'no-cors',
        keepalive: true,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
      });
    } catch (err) {
      queue(payload); // offline or blocked: retry on the next visit
    }
  }

  async function flushOutbox() {
    if (!CONFIG.submitUrl) return;
    const q = store.get(CONFIG.outboxKey) || [];
    if (!q.length) return;
    store.del(CONFIG.outboxKey);
    for (const p of q) await send(p);
  }

  /* =========================================================
     Celebration: confetti, sharing, card tilt
     ========================================================= */
  const CONFETTI_COLORS = ['#4a2c1a', '#6f4429', '#a8703f', '#d9a46c', '#f3dcc0', '#e8c27a'];
  let confettiCanvas = null;
  let confettiParts = [];
  let confettiRaf = 0;

  function sizeConfetti() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    confettiCanvas.width = innerWidth * dpr;
    confettiCanvas.height = innerHeight * dpr;
    confettiCanvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function spawn(x, y, angle, speed) {
    const r = Math.random();
    confettiParts.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 6 + Math.random() * 6,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.3,
      shape: r < 0.3 ? 'bean' : r < 0.75 ? 'strip' : 'dot',
      color: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0],
      life: 0,
      ttl: 150 + Math.random() * 90,
      flip: Math.random() * 10,
    });
    if (!confettiRaf) confettiRaf = requestAnimationFrame(tickConfetti);
  }

  function burst(origin, power = 1) {
    if (reducedMotion() || !origin) return;
    if (!confettiCanvas) {
      confettiCanvas = document.createElement('canvas');
      confettiCanvas.className = 'confetti';
      confettiCanvas.setAttribute('aria-hidden', 'true');
      document.body.appendChild(confettiCanvas);
      sizeConfetti();
    }
    const r = origin.getBoundingClientRect();
    const ox = r.left + r.width / 2;
    const oy = r.top + r.height / 2;
    const k = 0.6 + Math.min(1, innerWidth / 600) * 0.4; // gentler on phones
    const speed = k * (0.65 + 0.35 * power);
    for (let i = 0; i < Math.round(120 * power); i++) spawn(ox, oy, -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.2, (7 + Math.random() * 9) * speed);
    if (power < 1) return;
    setTimeout(() => {
      for (let i = 0; i < 45; i++) spawn(-10, innerHeight * 0.8, -Math.PI / 3 + (Math.random() - 0.5) * 0.7, (11 + Math.random() * 8) * k);
      for (let i = 0; i < 45; i++) spawn(innerWidth + 10, innerHeight * 0.8, (-2 * Math.PI) / 3 + (Math.random() - 0.5) * 0.7, (11 + Math.random() * 8) * k);
    }, 260);
  }

  function tickConfetti() {
    const ctx = confettiCanvas.getContext('2d');
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    confettiParts = confettiParts.filter((p) => p.life < p.ttl && p.y < innerHeight + 40);
    for (const p of confettiParts) {
      p.life += 1;
      p.vy += 0.22;
      p.vx *= 0.986;
      p.vy *= 0.986;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, (p.ttl - p.life) / 40));
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === 'strip') {
        ctx.scale(1, Math.cos(p.life * 0.18 + p.flip));
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      } else if (p.shape === 'dot') {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 3, 0, Math.PI * 2);
        ctx.fill();
      } else { // coffee bean
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size * 0.42, p.size * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(0, -p.size * 0.5);
        ctx.quadraticCurveTo(p.size * 0.22, 0, 0, p.size * 0.5);
        ctx.stroke();
      }
      ctx.restore();
    }
    confettiRaf = confettiParts.length ? requestAnimationFrame(tickConfetti) : 0;
  }
  window.addEventListener('resize', () => { if (confettiCanvas) sizeConfetti(); });

  async function share() {
    // The sharer's name becomes the new respondent's `source`, so referrals are traceable.
    const url = location.origin + location.pathname + '?src=' + encodeURIComponent(shareName || 'share');
    const text = 'I just took a 2-minute survey about Coffee Pass, a coffee subscription for Bengaluru’s independent cafés. Take it too:';
    if (navigator.share) {
      try {
        await navigator.share({ title: 'Coffee Pass survey', text, url });
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }
    }
    window.open('https://wa.me/?text=' + encodeURIComponent(text + ' ' + url), '_blank', 'noopener');
  }

  // On desktop, the Coffee Pass card leans gently towards the pointer.
  const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
  let tiltFrame = 0;
  document.addEventListener('pointermove', (e) => {
    if (!finePointer.matches || reducedMotion() || tiltFrame) return;
    const { clientX, clientY } = e;
    tiltFrame = requestAnimationFrame(() => {
      tiltFrame = 0;
      const beans = $('#beans');
      if (beans) {
        beans.style.setProperty('--px', (clientX / innerWidth - 0.5).toFixed(3));
        beans.style.setProperty('--py', (clientY / innerHeight - 0.5).toFixed(3));
      }
      const card = $('#stage .pass-card');
      if (!card) return;
      const r = card.getBoundingClientRect();
      const dx = (clientX - (r.left + r.width / 2)) / innerWidth;
      const dy = (clientY - (r.top + r.height / 2)) / innerHeight;
      card.style.setProperty('--ry', (dx * 18).toFixed(2) + 'deg');
      card.style.setProperty('--rx', (-dy * 14).toFixed(2) + 'deg');
    });
  });

  /* =========================================================
     Events
     ========================================================= */
  // Arrow keys move through radio buttons and select them; that
  // shouldn't jump to the next question.
  let arrowNav = false;
  document.addEventListener('keydown', (e) => { arrowNav = e.key.startsWith('Arrow'); }, true);
  document.addEventListener('pointerdown', () => { arrowNav = false; }, true);

  document.getElementById('survey').addEventListener('submit', (e) => {
    e.preventDefault();
    next();
  });
  backBtn.addEventListener('click', back);

  stage.addEventListener('click', (e) => {
    const action = e.target.closest('[data-action]');
    if (action) {
      if (action.dataset.action === 'start') start();
      if (action.dataset.action === 'restart') restart();
      if (action.dataset.action === 'share') share();
      if (action.dataset.action === 'burst') burst(action);
      if (action.dataset.action === 'burst-card') {
        action.classList.remove('tapped');
        void action.offsetWidth;
        action.classList.add('tapped');
      }
    }
  });

  // Tapping an answer that's already selected (e.g. after going Back) moves on too.
  let tapRadio = null;
  let tapWasChecked = false;
  stage.addEventListener('pointerdown', (e) => {
    const opt = e.target.closest('.option');
    tapRadio = opt ? $('input[type="radio"]', opt) : null;
    tapWasChecked = !!(tapRadio && tapRadio.checked);
  });
  stage.addEventListener('click', (e) => {
    const t = e.target;
    if (t === tapRadio && tapWasChecked && t.checked && !t.hasAttribute('data-other') && !t.hasAttribute('data-ends')) {
      scheduleAdvance();
    }
    if (t === tapRadio) tapRadio = null;
  });

  stage.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.matches('input[type="radio"], input[type="checkbox"]')) {
      e.preventDefault();
      next();
    }
  });

  stage.addEventListener('change', (e) => {
    const t = e.target;
    const s = currentStep();
    if (!s) return;
    const el = stage.firstElementChild;

    if (t.matches('[data-consent]')) {
      state.answers.waitlist_consent = t.checked;
      clearError(`e-${s.id}`);
      save();
      return;
    }

    if (t.type === 'radio' && s.type === 'single') {
      state.answers[s.id] = t.value;
      syncOther(el, s);
      clearError(`e-${s.id}`, $('[data-other-text]', el));
      save();
      updateNextLabel();
      if (t.hasAttribute('data-other')) {
        if (!arrowNav) $('[data-other-text]', el).focus();
        return;
      }
      if (!t.hasAttribute('data-ends') && !arrowNav) scheduleAdvance();
      return;
    }

    if (t.type === 'checkbox' && s.type === 'multi') {
      const boxes = $$(`input[name="${s.id}"]`, el);
      if (t.checked && t.hasAttribute('data-exclusive')) boxes.forEach((b) => { if (b !== t) b.checked = false; });
      else if (t.checked) boxes.forEach((b) => { if (b.hasAttribute('data-exclusive')) b.checked = false; });
      state.answers[s.id] = boxes.filter((b) => b.checked).map((b) => b.value);
      syncOther(el, s);
      clearError(`e-${s.id}`, $('[data-other-text]', el));
      save();
      if (t.checked && t.hasAttribute('data-other') && !arrowNav) $('[data-other-text]', el).focus();
    }
  });

  stage.addEventListener('input', (e) => {
    const t = e.target;
    const s = currentStep();
    if (!s) return;

    if (t.matches('[data-other-text]')) {
      state.answers[s.id + '_other'] = t.value;
      if (trim(t.value)) clearError(`e-${s.id}`, t);
      saveSoon();
      return;
    }

    const field = t.dataset.field;
    if (!field) return;
    state.answers[field] = t.value;
    const errId = t.getAttribute('aria-describedby');
    if (t.getAttribute('aria-invalid') === 'true') {
      const fixed = field === 'name' ? !!trim(t.value)
        : !trim(t.value) || (field === 'phone' ? phoneOk(t.value) : emailOk(t.value));
      if (fixed) clearError(errId, t);
    }
    if (s.type === 'contact' && (field === 'phone' || field === 'email') && trim(t.value)) {
      clearError(`e-${s.id}`);
      $$('#c-phone, #c-email', stage).forEach((inp) => {
        if (!trim(inp.value) || inp === t) inp.removeAttribute('aria-invalid');
      });
    }
    updateNextLabel();
    saveSoon();
  });

  stage.addEventListener('focusout', (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.field === 'phone' && phoneOk(t.value)) {
      t.value = fmtPhone(normPhone(t.value));
      state.answers.phone = t.value;
      saveSoon();
    }
  });

  window.addEventListener('pagehide', save);
  window.addEventListener('online', flushOutbox);

  /* =========================================================
     Start
     ========================================================= */
  const params = new URLSearchParams(location.search);
  if (params.has('reset')) {
    params.delete('reset');
    store.del(CONFIG.storageKey);
    state = freshState();
    const qs = params.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
  }

  // Scatter the drifting beans (negative delays so they're already mid-air on load).
  const beanBox = $('#beans');
  if (beanBox) {
    beanBox.innerHTML = Array.from({ length: 16 }, () => {
      const size = 14 + Math.random() * 22;
      return `<span class="bean" style="--x:${(Math.random() * 100).toFixed(1)}%;--s:${size.toFixed(0)}px;--d:${(16 + Math.random() * 14).toFixed(1)}s;--delay:${(-Math.random() * 30).toFixed(1)}s;--r:${Math.floor(Math.random() * 360)}deg;--o:${(0.1 + Math.random() * 0.2).toFixed(2)};--sway:${Math.round((Math.random() - 0.5) * 70)}px">${BEAN_SVG}</span>`;
    }).join('');
  }

  const initial = state.done ? { view: 'done' } : { view: 'intro' };
  history.replaceState(entry(initial), '');
  render(initial, 0);
  flushOutbox();
})();
</script>
</body>
</html>
