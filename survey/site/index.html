<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Pass survey</title>
<meta name="description" content="A 2-minute survey about Coffee Pass: one monthly pass for your favourite independent cafés in Bengaluru.">
<meta name="theme-color" content="#FFFFFF" id="theme-color">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #2340D8;
  --blue-dark: #1A30A8;
  --ink: #0E1330;
  --muted: #5A6180;
  --line: #DCE1F5;
  --radio: #B9C2EC;
  --tint: #F3F5FE;
  --white: #FFFFFF;
  --error: #C4320A;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--white);
  color: var(--ink);
  font-family: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .35s ease;
}
body[data-theme="blue"] { background: var(--blue); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1:focus { outline: none; }

/* ---------- Screen shell ---------- */
.screen {
  /* Light theme tokens */
  --fg: var(--ink);
  --fg-muted: var(--muted);
  --border: var(--line);
  --opt-bg: var(--white);
  --sel-bg: var(--blue);
  --sel-fg: var(--white);
  --sel-sub: rgba(255, 255, 255, .82);
  --mark-off: var(--radio);
  --btn-bg: var(--blue);
  --btn-fg: var(--white);
  --link: var(--blue);
  --err: var(--error);
  --bg: var(--white);
  position: relative;
  width: 100%;
  max-width: 440px;
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  color: var(--fg);
}
.screen > * { flex-shrink: 0; }
html, body { overscroll-behavior: none; }
body:not([data-view="desk"]) { height: 100vh; height: 100dvh; overflow: hidden; }
.screen.blue {
  --fg: var(--white);
  --fg-muted: rgba(255, 255, 255, .82);
  --border: rgba(255, 255, 255, .5);
  --opt-bg: transparent;
  --sel-bg: var(--white);
  --sel-fg: var(--blue);
  --sel-sub: var(--muted);
  --mark-off: rgba(255, 255, 255, .65);
  --btn-bg: var(--white);
  --btn-fg: var(--blue);
  --link: var(--white);
  --err: #FFE1D6;
  --bg: var(--blue);
}
.screen > .enter { display: contents; }
.anim { animation: enter-fwd .42s var(--ease) both; }
.anim.rev { animation-name: enter-back; }
@keyframes enter-fwd { from { opacity: 0; transform: translateX(28px); } }
@keyframes enter-back { from { opacity: 0; transform: translateX(-28px); } }

.top { display: flex; align-items: center; gap: 14px; padding: 20px 20px 0; }
.back {
  width: 44px; height: 44px; flex: none; border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--border); background: transparent; color: var(--fg); padding: 0;
  transition: transform .15s ease;
}
.back:active { transform: scale(.94); }
.back svg { width: 18px; height: 18px; }
.progress { flex: 1; display: block; height: 12px; min-width: 0; }
.progress path { fill: none; stroke-linecap: round; }
.progress .track { stroke: var(--line); stroke-width: 3; }
.progress .fill { stroke: var(--blue); stroke-width: 3.4; transition: stroke-dasharray .6s var(--ease); }
.blue .progress .track { stroke: rgba(255, 255, 255, .3); }
.blue .progress .fill { stroke: var(--white); }
.count, .top-note { font-size: 13px; font-weight: 600; color: var(--fg-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.top-note { margin-left: auto; }

.art-wrap { flex: none; margin: 10px 0 8px; overflow: hidden; }
.art { display: block; width: 100%; max-width: 390px; height: auto; overflow: visible; }

.head { padding: 0 24px; }
.eyebrow { margin: 0 0 8px; font-size: 14px; font-weight: 600; color: var(--blue); }
.blue .eyebrow { color: var(--white); }
h1.title { margin: 0; font-size: var(--size, 30px); line-height: 1.12; font-weight: 600; letter-spacing: -0.025em; }
.sub { margin: 10px 0 0; font-size: 15px; line-height: 1.4; color: var(--fg-muted); }

/* ---------- Options ---------- */
.opts { padding: 22px 24px 0; }
.opts.list { display: flex; flex-direction: column; gap: 10px; }
.opts.list.compact { gap: 8px; }
.opt {
  -webkit-appearance: none; appearance: none; margin: 0;
  background: var(--opt-bg); border: 1.5px solid var(--border); color: var(--fg);
  font-weight: 500; text-align: left;
  transition: background-color .18s ease, border-color .18s ease, color .18s ease, transform .12s ease;
}
.opt:active { transform: scale(.985); }
.opt[aria-checked="true"], .opt[aria-pressed="true"] { background: var(--sel-bg); border-color: var(--sel-bg); color: var(--sel-fg); }
.list .opt {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  width: 100%; min-height: 54px; padding: 8px 16px 8px 18px; border-radius: 16px; font-size: 16px; line-height: 1.25;
}
.list.compact .opt { min-height: 50px; }
.mark { flex: none; width: 24px; height: 24px; display: grid; }
.mark svg { grid-area: 1 / 1; width: 24px; height: 24px; overflow: visible; }
.mark .on { opacity: 0; transform: scale(.6); transition: opacity .18s ease, transform .25s var(--ease); }
.mark .off path { stroke: var(--mark-off); }
.mark .on .bg { fill: var(--sel-fg); stroke: var(--sel-fg); }
.mark .on .tick { stroke: var(--sel-bg); }
[aria-checked="true"] .mark .on, [aria-pressed="true"] .mark .on { opacity: 1; transform: none; }
[aria-checked="true"] .mark .off, [aria-pressed="true"] .mark .off { opacity: 0; }

.opts.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips .opt {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 46px; padding: 6px 16px; border-radius: 999px; font-size: 15px; line-height: 1.2;
}
.chips .opt .tick { display: none; width: 16px; height: 16px; flex: none; }
.chips .opt[aria-pressed="true"] .tick, .chips .opt[aria-checked="true"] .tick { display: block; }

.opts.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cards .opt {
  height: 104px; border-radius: 18px; padding: 14px 16px;
  display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
}
.cards .num { font-size: 34px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
.cards .lbl { font-size: 14px; font-weight: 500; color: var(--fg-muted); }
.cards .opt[aria-checked="true"] .lbl { color: var(--sel-sub); }
.opts.extra { padding-top: 10px; }

.groups { display: flex; flex-direction: column; gap: 22px; padding-top: 24px; }
.group { padding: 0 24px; }
.group-label { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--fg-muted); }
.group .opts { padding: 0; }

/* ---------- Fields ---------- */
.fields { padding: 16px 24px 0; display: flex; flex-direction: column; gap: 12px; }
.fields[hidden] { display: none; }
.field-label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--fg-muted); }
.field {
  display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px;
  border-radius: 14px; border: 1.5px solid var(--line); background: var(--white);
  transition: border-color .18s ease;
}
.field:focus-within { border-color: var(--blue); }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; font-size: calc(16px * var(--text-scale, 1)); color: var(--ink); background: transparent; padding: 0; }
.field input::placeholder, textarea::placeholder { color: #8B91AC; }
.field .prefix { font-size: 16px; font-weight: 500; color: var(--ink); padding-right: 10px; border-right: 1px solid var(--line); }
.field-label textarea {
  height: 120px; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line);
  font-size: calc(16px * var(--text-scale, 1)); color: var(--ink); resize: none; outline: 0; background: var(--white); font-weight: 400;
  transition: border-color .18s ease;
}
.field-label textarea:focus { border-color: var(--blue); }
[aria-invalid="true"] { border-color: var(--error) !important; }
.field:has(input[aria-invalid="true"]) { border-color: var(--error); }
.or { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
.or span { flex: 1; height: 1px; background: var(--line); }
.fine { margin: 0; font-size: 13px; line-height: 1.4; color: var(--muted); }
.field-err { margin: 0; min-height: 0; font-size: 13px; font-weight: 500; color: var(--error); }
.field-err:empty { display: none; }
.other-field { padding: 16px 24px 0; }
.other-field[hidden] { display: none; }

.hint {
  margin: 14px 24px 0; padding: 14px 16px; border-radius: 16px; background: var(--tint);
  display: flex; align-items: center; gap: 12px;
}
.hint[hidden] { display: none; }
.hint svg { flex: none; width: 36px; height: 22px; overflow: visible; }
.hint p { margin: 0; font-size: 15px; line-height: 1.35; color: var(--ink); }
.hint strong { color: var(--blue); font-weight: 600; }

.error { margin: 0; padding: 12px 24px 0; font-size: 14px; font-weight: 500; color: var(--err); }
.error:empty { display: none; }

/* ---------- Footer & buttons ---------- */
.foot {
  margin-top: auto; padding: 16px 24px max(30px, env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 16px;
}
.foot.stack { display: block; padding-top: 14px; padding-bottom: max(26px, env(safe-area-inset-bottom)); }
.btn {
  -webkit-appearance: none; appearance: none;
  flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
  height: 56px; border-radius: 999px; border: 0;
  background: var(--btn-bg); color: var(--btn-fg);
  font-size: 17px; font-weight: 600; letter-spacing: -0.01em; text-decoration: none;
  transition: transform .12s ease, box-shadow .2s ease, background-color .2s ease;
}
.btn:active { transform: scale(.98); }
.btn svg { width: 18px; height: 18px; flex: none; transition: transform .2s var(--ease); }
.btn:hover svg.arrow { transform: translateX(3px); }
.btn.outline { background: var(--white); color: var(--blue); border: 1.5px solid var(--blue); }
.text-btn {
  -webkit-appearance: none; appearance: none; background: none; border: 0;
  color: var(--link); font-size: 16px; font-weight: 600; padding: 0 8px; height: 56px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.text-btn.block { width: 100%; height: auto; margin-top: 10px; padding: 10px 0; font-size: 15px; }
.foot-note { margin: 14px 0 0; text-align: center; font-size: 13px; line-height: 1.4; color: var(--fg-muted); }
.dots { display: flex; gap: 6px; justify-content: center; padding-top: 18px; }
.dots span { width: 6px; height: 6px; border-radius: 3px; background: var(--line); transition: width .3s var(--ease); }
.dots span.on { width: 20px; background: var(--blue); }
.blue .dots span { background: rgba(255, 255, 255, .35); }
.blue .dots span.on { background: var(--white); }

:focus-visible { outline: 3px solid #7C8CF0; outline-offset: 2px; }
.blue :focus-visible { outline-color: #FFFFFF; }

/* ---------- Intro ---------- */
.hero > div { width: 100%; }
.intro-copy { padding: 30px 24px 0; }
.intro-copy .eyebrow { font-size: 14px; margin-bottom: 10px; }
.intro-copy h1 { margin: 0; font-size: 36px; line-height: 1.08; font-weight: 600; letter-spacing: -0.03em; }
.underlined { position: relative; display: inline-block; }
.underlined .ul { position: absolute; left: 0; right: 0; bottom: -10px; }
.underlined .ul svg { display: block; width: 100%; height: auto; overflow: visible; }
.lede { margin: 20px 0 0; font-size: 17px; line-height: 1.45; color: var(--fg-muted); max-width: 290px; }
.intro2-art { padding-top: 40px; overflow: hidden; }
.intro2-copy { padding: 34px 24px 0; }
.intro2-copy h1 { margin: 0; font-size: 40px; line-height: 1.05; font-weight: 600; letter-spacing: -0.03em; }
.intro2-copy .lede { margin-top: 16px; max-width: none; }
.facts { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
.fact { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 500; }
.fact span { width: 40px; height: 40px; flex: none; border-radius: 20px; background: rgba(255, 255, 255, .14); display: flex; align-items: center; justify-content: center; }
.fact svg { width: 20px; height: 20px; }
.preview-note { margin: 10px 0 0; font-size: 12px; text-align: center; color: var(--fg-muted); }

/* ---------- End screens ---------- */
.confetti { position: absolute; top: 0; left: 50%; width: 100%; max-width: 390px; height: auto; transform: translateX(-50%); pointer-events: none; overflow: visible; }
.end-art { padding-top: 60px; overflow: hidden; position: relative; }
.end-art .art { margin: 0 auto; }
.end-copy { padding: 34px 32px 0; text-align: center; position: relative; }
.end-copy h1 { margin: 0; font-size: 38px; line-height: 1.08; font-weight: 600; letter-spacing: -0.03em; }
.end-copy p { margin: 14px 0 0; font-size: 17px; line-height: 1.45; color: var(--fg-muted); }
.end-foot { margin-top: auto; padding: 24px 24px max(34px, env(safe-area-inset-bottom)); position: relative; }
.end-foot .foot-note { font-size: 14px; }
.pop { animation: pop .6s var(--ease) both .1s; }
@keyframes pop { from { opacity: 0; transform: scale(.85) translateY(10px); } }

/* ---------- Desktop: open on your phone ---------- */
.desk { display: flex; min-height: 100vh; min-height: 100dvh; width: 100%; background: var(--white); color: var(--ink); }
.desk-art { width: 44%; max-width: 560px; flex: none; background: var(--blue); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.desk-art svg { width: min(440px, 80%); height: auto; overflow: visible; }
.desk-copy { flex: 1; min-width: 0; padding: 40px clamp(32px, 6vw, 96px); display: flex; flex-direction: column; justify-content: center; }
.desk-copy .eyebrow { font-size: 16px; margin-bottom: 14px; }
.desk-copy h1 { margin: 0; font-size: clamp(48px, 5vw, 64px); line-height: 1.02; font-weight: 600; letter-spacing: -0.035em; }
.desk-copy .underlined .ul { bottom: -12px; }
.desk-copy .lede { margin-top: 28px; max-width: 440px; font-size: 19px; line-height: 1.5; color: var(--muted); }
.desk-row { display: flex; flex-wrap: wrap; align-items: center; gap: 24px 32px; margin-top: 40px; }
.qr { position: relative; width: 196px; height: 196px; flex: none; display: flex; align-items: center; justify-content: center; }
.qr .frame { position: absolute; inset: 0; }
.qr .frame svg { width: 196px; height: 196px; overflow: visible; }
.qr .code { width: 150px; height: 150px; }
.qr .code svg { display: block; width: 150px; height: 150px; }
.qr[hidden] { display: none; }
.desk-actions { display: flex; flex-direction: column; gap: 14px; width: 220px; }
.desk-actions .btn { flex: none; }
.desk-actions .text-btn { height: 44px; color: var(--blue); }
body[data-view="desk"] { background: var(--white); }
@media (max-width: 1100px) {
  .desk-art { width: 38%; }
  .desk-copy h1 { font-size: clamp(40px, 5vw, 64px); }
  .desk-copy .lede { font-size: 17px; margin-top: 22px; }
  .desk-row { margin-top: 28px; }
}
@media (max-width: 900px) {
  .desk-art { width: 32%; }
}

/* ---------- Fitting every screen on one phone screen ----------
   fit() adds .fit1 … .fit4 (cumulative) until the content fits the screen height. */
.spacer { height: 28px; }
/* Keyboard open: the screen follows the visible area above the keyboard. */
.screen.kb { position: fixed; top: 0; left: 0; right: 0; z-index: 5; }
.kb .art-wrap { display: none; }
.kb .head { padding-top: 14px; }
.kb .field-label textarea { height: 104px; }
.kb .foot { position: sticky; bottom: 0; z-index: 2; background: var(--bg); }
.kb .anim, .screen.kb.anim { animation: none; }
@media (max-width: 360px) {
  .screen { --cap: 26px; }
  h1.title { font-size: min(var(--size, 30px), 26px); }
  .intro-copy h1 { font-size: 32px; }
}
/* Level 1: smaller illustrations */
.fit1 .art-wrap { margin: 6px 0 6px; }
.fit1 .art-wrap .art { height: 116px; width: auto; }
.fit1 .hero > div { height: 320px !important; }
.fit1 .intro2-art { padding-top: 20px; }
.fit1 .intro2-art .art { height: 180px; width: auto; margin: 0 auto; }
.fit1 .end-art { padding-top: 36px; }
.fit1 .end-art .art { height: 230px; width: auto; }
.fit1 .spacer { height: 18px; }
/* Level 2: tighter spacing */
.fit2 .top { padding-top: 14px; }
.fit2 .art-wrap .art { height: 84px; }
.fit2 h1.title { font-size: min(calc(var(--size, 30px) - 2px), var(--cap, 99px)); }
.fit2 .sub { margin-top: 6px; }
.fit2 .opts { padding-top: 16px; }
.fit2 .opts.list, .fit2 .opts.list.compact { gap: 8px; }
.fit2 .list .opt, .fit2 .list.compact .opt { min-height: 48px; padding-top: 6px; padding-bottom: 6px; }
.fit2 .chips .opt { min-height: 42px; }
.fit2 .cards .opt { height: 88px; }
.fit2 .cards .num { font-size: 30px; }
.fit2 .groups { gap: 16px; padding-top: 18px; }
.fit2 .hint { margin-top: 10px; padding: 10px 14px; }
.fit2 .other-field { padding-top: 12px; }
.fit2 .error { padding-top: 8px; }
.fit2 .foot { padding-top: 12px; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
.fit2 .btn { height: 52px; }
.fit2 .hero > div { height: 270px !important; }
.fit2 .pass-float { zoom: .88; }
.fit2 .intro-copy { padding-top: 22px; }
.fit2 .intro-copy h1 { font-size: 32px; }
.fit2 .lede { margin-top: 14px; }
.fit2 .intro2-art .art { height: 140px; }
.fit2 .intro2-copy { padding-top: 22px; }
.fit2 .intro2-copy h1 { font-size: 34px; }
.fit2 .facts { margin-top: 18px; }
.fit2 .foot-note { margin-top: 10px; }
.fit2 .dots { padding-top: 12px; }
.fit2 .end-art { padding-top: 24px; }
.fit2 .end-art .art { height: 180px; }
.fit2 .end-copy { padding-top: 20px; }
.fit2 .end-copy h1 { font-size: 32px; }
.fit2 .end-foot { padding-bottom: max(22px, env(safe-area-inset-bottom)); }
.fit2 .spacer { height: 8px; }
.fit2 .fields { gap: 10px; padding-top: 12px; }
.fit2 .field { height: 48px; }
.fit2 .field-label textarea { height: 96px; }
/* Level 3: drop the question illustration, smaller controls */
.fit3 .art-wrap { display: none; }
.fit3 .head { padding-top: 18px; }
.fit3 h1.title { font-size: min(calc(var(--size, 30px) - 4px), var(--cap, 99px)); }
.fit3 .sub { font-size: 14px; }
.fit3 .opts { padding-top: 14px; }
.fit3 .opts.list, .fit3 .opts.list.compact { gap: 6px; }
.fit3 .list .opt, .fit3 .list.compact .opt { min-height: 44px; font-size: 15px; }
.fit3 .chips { gap: 6px; }
.fit3 .chips .opt { min-height: 38px; font-size: 14px; padding: 4px 14px; }
.fit3 .cards .opt { height: 76px; padding: 10px 14px; }
.fit3 .cards .num { font-size: 26px; }
.fit3 .groups { gap: 12px; padding-top: 14px; }
.fit3 .group-label { margin-bottom: 6px; }
.fit3 .hint p { font-size: 14px; }
.fit3 .hero > div { height: 220px !important; }
.fit3 .pass-float { zoom: .74; }
.fit3 .intro-copy h1 { font-size: 30px; }
.fit3 .lede { font-size: 16px; }
.fit3 .intro2-art .art { height: 104px; }
.fit3 .intro2-copy h1 { font-size: 30px; }
.fit3 .facts { gap: 8px; margin-top: 14px; }
.fit3 .end-art .art { height: 140px; }
.fit3 .end-copy h1 { font-size: 30px; }
.fit3 .end-copy p { font-size: 16px; }
.fit3 .fields { gap: 8px; }
.fit3 .field { height: 44px; }
.fit3 .field-label { gap: 4px; }
.fit3 .fine { font-size: 12px; }
.fit3 .field-label textarea { height: 80px; }
.fit3 .text-btn.block { margin-top: 4px; padding: 8px 0; }
/* Level 4: smallest */
.fit4 .top { padding: 10px 16px 0; }
.fit4 .back { width: 38px; height: 38px; }
.fit4 .head, .fit4 .opts, .fit4 .group, .fit4 .fields, .fit4 .other-field, .fit4 .error { padding-left: 20px; padding-right: 20px; }
.fit4 .head { padding-top: 12px; }
.fit4 .group .opts { padding-left: 0; padding-right: 0; }
.fit4 h1.title { font-size: 22px; }
.fit4 .opts { padding-top: 10px; }
.fit4 .list .opt, .fit4 .list.compact .opt { min-height: 40px; padding: 4px 14px; }
.fit4 .chips .opt { min-height: 36px; }
.fit4 .cards .opt { height: 64px; }
.fit4 .cards .num { font-size: 22px; }
.fit4 .cards .lbl { font-size: 13px; }
.fit4 .hint { margin: 8px 20px 0; padding: 8px 12px; }
.fit4 .foot { padding: 10px 20px max(14px, env(safe-area-inset-bottom)); }
.fit4 .btn { height: 48px; font-size: 16px; }
.fit4 .hero > div { height: 180px !important; }
.fit4 .pass-float { zoom: .6; }
.fit4 .intro-copy { padding-top: 16px; }
.fit4 .intro-copy h1 { font-size: 27px; }
.fit4 .lede { font-size: 15px; margin-top: 10px; }
.fit4 .intro2-art .art { height: 80px; }

/* ---------- Motion (only when the user hasn't asked for less) ---------- */
.wd { display: inline-block; }
.w { display: inline-block; white-space: nowrap; }
.ch { display: inline-block; }
.pass-card { overflow: hidden; cursor: pointer; }
.pass-shine { position: absolute; inset: -20%; background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.28) 50%, transparent 62%); transform: translateX(-120%); pointer-events: none; }
.hero > div { perspective: 900px; }
.btn.cta { position: relative; overflow: hidden; --ring: rgba(35,64,216,.35); --ring-0: rgba(35,64,216,0); }
.blue .btn.cta { --ring: rgba(255,255,255,.45); --ring-0: rgba(255,255,255,0); }
.btn-shine { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.35) 50%, transparent 65%); transform: translateX(-120%); pointer-events: none; }
.blue .btn-shine { background: linear-gradient(105deg, transparent 35%, rgba(35,64,216,.12) 50%, transparent 65%); }
.end-art[data-action] { cursor: pointer; }
.confetti-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

@media (prefers-reduced-motion: no-preference) {
  .rise { animation: rise .7s var(--ease) backwards; animation-delay: var(--d, 0s); }
  .wd { animation: word .8s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i) * 55ms + var(--base, .2s)); }
  .ul path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .9s var(--ease) forwards; animation-delay: var(--ul, 1s); }

  /* Intro 1: the pass */
  .pass-float { animation: pass-in 1s cubic-bezier(.2,.8,.2,1) backwards .1s, float 6s ease-in-out 1.1s infinite; }
  .pass-card.tapped { animation: tap-pop .45s cubic-bezier(.34,1.56,.64,1); }
  .pass-shine { animation: shine 5.5s ease-in-out 1.6s infinite; }
  .cups > svg { animation: cup-pop .5s cubic-bezier(.34,1.56,.64,1) backwards; animation-delay: calc(var(--c) * 70ms + .7s); }
  .cups > svg:nth-child(-n+3) { animation: cup-pop .5s cubic-bezier(.34,1.56,.64,1) backwards, stamp 6s ease-in-out infinite;
    animation-delay: calc(var(--c) * 70ms + .7s), calc(var(--c) * .25s + 2.2s); }
  .cups > svg:nth-child(4) { animation: cup-pop .5s cubic-bezier(.34,1.56,.64,1) backwards, cup-stamp 6s ease-in-out 2.6s infinite;
    animation-delay: calc(var(--c) * 70ms + .7s), 2.6s; }
  .cups > svg:nth-child(4) path:nth-child(1) { animation: cup-bg 6s ease-in-out 2.6s infinite; }
  .cups > svg:nth-child(4) path:nth-child(2) { animation: cup-ink 6s ease-in-out 2.6s infinite; }
  .cups > svg:nth-child(4) path:nth-child(3) { animation: cup-handle 6s ease-in-out 2.6s infinite; }
  .sparkle { animation: twinkle 2.8s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .croissant { animation: rise .8s var(--ease) backwards .5s, float 7s ease-in-out 1.3s infinite; }

  /* Buttons that start things */
  .btn.cta { animation: rise .7s var(--ease) backwards var(--d, .9s), btn-glow 2.4s ease-out 2.4s infinite; }
  .btn.cta .btn-shine { animation: shine 3.4s ease-in-out 2s infinite; }
  .btn.cta svg.arrow { animation: nudge 1.6s ease-in-out 2s infinite; }

  /* Intro 2 */
  .intro2-art .art { animation: rise .8s var(--ease) backwards, float 6s ease-in-out .8s infinite; }
  .fact { animation: perk-in .6s cubic-bezier(.34,1.56,.64,1) backwards; animation-delay: calc(var(--i) * .14s + .75s); }
  .clock-hand { transform-box: view-box; transform-origin: 12px 12px; animation: spin 6s linear infinite; }

  /* Questions */
  .anim .art-wrap .art { animation: art-in .6s var(--ease) backwards .05s; }
  .art-wrap .art { animation: float-soft 7s ease-in-out .7s infinite; }
  .anim .art-wrap .art { animation: art-in .6s var(--ease) backwards .05s, float-soft 7s ease-in-out .7s infinite; }
  .anim .opts .opt, .anim .group { animation: rise .42s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 35ms + 90ms); }
  .opt.pop { animation: sel-pop .35s var(--ease); }

  .cards .opt.pop .num { animation: num .4s cubic-bezier(.34,1.56,.64,1); }

  .hint:not([hidden]) { animation: rise .3s var(--ease) backwards; }
  .hint strong { display: inline-block; animation: num .4s cubic-bezier(.34,1.56,.64,1) backwards; }
  .error:not(:empty), .field-err:not(:empty) { animation: fade .2s var(--ease); }

  /* End screens */
  .confetti { animation: fade 1s ease .3s backwards, drift 9s ease-in-out 1.3s infinite alternate; }
  .end-art .art { animation: float 6s ease-in-out 1.2s infinite; }
  .ch { animation: letter .7s cubic-bezier(.2,.9,.3,1.3) backwards; animation-delay: calc(var(--i) * 40ms + .45s); }
  .end-copy p { animation: rise .6s var(--ease) backwards 1s; }
  .end-foot { animation: rise .6s var(--ease) backwards 1.3s; }
  .end-foot .btn.cta { animation: btn-glow 2.4s ease-out 2.6s infinite; }

  /* Desktop */
  .desk-art svg { animation: rise .9s var(--ease) backwards .1s, float 6s ease-in-out 1s infinite; }
  .desk-copy > * { animation: rise .7s var(--ease) backwards; }

  .desk-copy > :nth-child(3) { animation-delay: .8s; }
  .desk-copy > :nth-child(4) { animation-delay: 1s; }
  .qr:not([hidden]) { animation: pop .6s cubic-bezier(.34,1.56,.64,1) backwards; }
}
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes word { from { opacity: 0; transform: translateY(.45em) rotate(2deg); filter: blur(8px); } }
@keyframes letter { from { opacity: 0; transform: translateY(.5em) scale(.8) rotate(-6deg); filter: blur(6px); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pass-in { from { opacity: 0; transform: translateY(28px) rotateX(28deg) scale(.9); } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes float-soft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes art-in { from { opacity: 0; transform: translateY(10px) scale(.97); } }
@keyframes shine { 0% { transform: translateX(-120%); } 35%, 100% { transform: translateX(120%); } }
@keyframes tap-pop { 40% { transform: rotate(-4deg) scale(.93); } }
@keyframes cup-pop { from { opacity: 0; transform: scale(0) rotate(-20deg); } }
@keyframes stamp { 0%, 6%, 100% { transform: scale(1); } 3% { transform: scale(1.22); } }
@keyframes cup-stamp { 0%, 30%, 40%, 100% { transform: scale(1); } 34% { transform: scale(1.3); } }
@keyframes cup-bg { 0%, 31% { fill: transparent; } 34%, 86% { fill: #FFFFFF; } 92%, 100% { fill: transparent; } }
@keyframes cup-ink { 0%, 31% { fill: transparent; stroke: #FFFFFF; } 34%, 86% { fill: #2340D8; stroke: #2340D8; } 92%, 100% { fill: transparent; stroke: #FFFFFF; } }
@keyframes cup-handle { 0%, 31% { stroke: #FFFFFF; } 34%, 86% { stroke: #2340D8; } 92%, 100% { stroke: #FFFFFF; } }
@keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.7) rotate(0deg); } 50% { opacity: 1; transform: scale(1.1) rotate(90deg); } }
@keyframes btn-glow { 0% { box-shadow: 0 0 0 0 var(--ring); } 70%, 100% { box-shadow: 0 0 0 16px var(--ring-0); } }
@keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
@keyframes perk-in { from { opacity: 0; transform: translateY(10px) scale(.6); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes sel-pop { 40% { transform: scale(1.025); } }
@keyframes num { from { transform: scale(.6); opacity: 0; } }
@keyframes drift { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(8px) rotate(.6deg); } }

  function loadState() {
    const saved = store.get(CONFIG.storageKey);

  let view = state.done ? 'done' : state.view; // what's on screen ('desk' is never saved)
  let shareName = ''; // respondent's name, used as ?src= on the share link; memory only
  let lastPct = 0;

  function save() {
    state.updatedAt = Date.now();
    store.set(CONFIG.storageKey, state);
  }
  let saveTimer;
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 250); }

  const app = $('#app');
  const currentStep = () => (view === 'step' ? STEPS[state.step] : null);
  const order = (v, step) => (v === 'desk' ? -1 : v === 'step' ? 2 + step : v === 'intro1' ? 0 : v === 'intro2' ? 1 : v === 'waitlist' ? 2 + TOTAL : 3 + TOTAL);

  /* =========================================================
     Rendering
     ========================================================= */
  function topHTML(n) {
    const pct = Math.round((n / TOTAL) * 100);
    return `<div class="top">
      <button type="button" class="back" data-action="back" aria-label="Back">${ICON.back}</button>
      <svg class="progress" viewBox="0 0 200 12" preserveAspectRatio="none" role="progressbar" aria-label="Survey progress" aria-valuemin="0" aria-valuemax="${TOTAL}" aria-valuenow="${n}">
        <path class="track" d="${PROGRESS_PATH}" vector-effect="non-scaling-stroke"/>
        <path class="fill" d="${PROGRESS_PATH}" vector-effect="non-scaling-stroke" pathLength="100" stroke-dasharray="${lastPct} 100" data-pct="${pct}"/>
      </svg>
      <span class="count">${n} of ${TOTAL}</span>
    </div>`;
  }

  function isSelected(field, value) {
    const v = state.answers[field];
    return Array.isArray(v) ? v.includes(value) : v === value;
  }
  function stateAttr(multi, sel) {
    return multi ? `aria-pressed="${sel}"` : `role="radio" aria-checked="${sel}"`;
  }

  function listHTML(s) {
    const shape = s.multi ? SQUARE : CIRCLE;
    return `<div class="opts list${s.compact ? ' compact' : ''}" data-field="${s.id}" data-multi="${!!s.multi}"
        role="${s.multi ? 'group' : 'radiogroup'}" aria-labelledby="q-title">
      ${s.opts.map((o, k) => `<button type="button" class="opt" style="--i:${k}" data-value="${esc(o.label)}" ${stateAttr(s.multi, isSelected(s.id, o.label))}>
        <span>${esc(o.label)}</span>${markHTML(shape)}</button>`).join('')}
    </div>`;
  }

  function chipsHTML(field, opts, multi, label) {
    return `<div class="opts chips" data-field="${field}" data-multi="${!!multi}"
        role="${multi ? 'group' : 'radiogroup'}" ${label ? `aria-label="${esc(label)}"` : 'aria-labelledby="q-title"'}>
      ${opts.map((o, k) => `<button type="button" class="opt" style="--i:${k}" data-value="${esc(o.label)}" ${stateAttr(multi, isSelected(field, o.label))}>
        ${ICON.tick}${esc(o.label)}</button>`).join('')}
    </div>`;
  }

  function cardsHTML(s) {
    return `<div class="opts cards" data-field="${s.id}" data-multi="false" role="radiogroup" aria-labelledby="q-title">
      ${s.cards.map(([num, lbl], k) => `<button type="button" class="opt" style="--i:${k}" data-value="${num}" ${stateAttr(false, isSelected(s.id, num))}
          aria-label="${num} coffees, ${esc(lbl.toLowerCase())}">
        <span class="num">${num}</span><span class="lbl">${esc(lbl)}</span></button>`).join('')}
    </div>
    <div class="opts list extra" data-field="${s.id}" data-multi="false" role="radiogroup" aria-labelledby="q-title">
      <button type="button" class="opt" style="--i:4" data-value="${esc(s.extra)}" ${stateAttr(false, isSelected(s.id, s.extra))}>
        <span>${esc(s.extra)}</span>${markHTML(CIRCLE)}</button>
    </div>`;
  }

  function otherHTML(s) {
    const o = s.opts.find((x) => x.other);
    if (!o) return '';
    const shown = isSelected(s.id, o.label);
    return `<div class="other-field" data-other-for="${s.id}" ${shown ? '' : 'hidden'}>
      <label class="field-label">${esc(o.other.label)}
        <span class="field"><input type="text" data-text="${s.id}_other" value="${esc(state.answers[s.id + '_other'] || '')}"
          placeholder="${esc(o.other.placeholder)}" autocomplete="off" maxlength="80" enterkeyhint="next"></span>
      </label>
    </div>`;
  }

  function hintText() {
    const p = PRICE_POINTS[state.answers.price_per_coffee];
    if (!p) return '';
    const n = parseInt(state.answers.coffees_per_month, 10) || 20;
    const total = p.per * n;
    const lead = p.kind === 'under' ? 'That’s under ' : p.kind === 'over' ? 'That’s ' : 'That’s about ';
    const strong = p.kind === 'under' ? inr(total) : p.kind === 'over' ? inr(total) + '+' : inr(Math.round(total / 100) * 100);
    return `${lead}<strong>${strong} a month</strong> for ${n} coffees.`;
  }
  function hintHTML() {
    const t = hintText();
    return `<div class="hint" id="hint" ${t ? '' : 'hidden'} aria-live="polite">${ART.hint}<p>${t}</p></div>`;
  }

  function stepHTML(s, i) {
    let body = '';
    if (s.kind === 'list') body = listHTML(s) + (s.hint ? hintHTML() : '');
    if (s.kind === 'chips') body = chipsHTML(s.id, s.opts, s.multi) + otherHTML(s);
    if (s.kind === 'cards') body = cardsHTML(s);
    if (s.kind === 'text') {
      body = `<div class="opts"><label class="field-label">${esc(s.label)}
        <textarea data-text="${s.id}" placeholder="${esc(s.placeholder)}" maxlength="300">${esc(state.answers[s.id] || '')}</textarea></label></div>`;
    }
    if (s.kind === 'about') {
      body = `<div class="groups">${s.groups.map((g, k) => `<div class="group" style="--i:${k * 4}">
        <p class="group-label" id="g-${g.id}">${esc(g.label)}</p>${chipsHTML(g.id, g.opts, false, g.label)}</div>`).join('')}</div>`;
    }
    return `
      ${topHTML(i + 1)}
      <div class="art-wrap">${ART['q' + (i + 1)]}</div>
      <div class="head" style="--size:${s.size || 30}px">
        ${s.eyebrow ? `<p class="eyebrow">${esc(s.eyebrow)}</p>` : ''}
        <h1 class="title" id="q-title" tabindex="-1">${esc(s.title)}</h1>
        ${s.sub ? `<p class="sub" id="q-sub">${esc(s.sub)}</p>` : ''}
      </div>
      ${body}
      <p class="error" id="err" role="alert"></p>
      <div class="foot">
        ${s.optional ? '<button type="button" class="text-btn" data-action="skip">Skip</button>' : ''}
        <button type="submit" class="btn">Next${ICON.arrow}</button>
      </div>`;
  }

  function intro1HTML() {
    return `
      <div class="hero">${animatedHero(ART.intro1Hero)}</div>
      <div class="intro-copy">
        <p class="eyebrow rise" style="--d:.25s">Introducing Coffee Pass</p>
        <h1 tabindex="-1" style="--base:.4s;--ul:1.05s">${words('Your favourite cafés.')}<br><span class="underlined">${words('One monthly pass.', 3)}<span class="ul">${drawable(ART.intro1Underline)}</span></span></h1>
        <p class="lede rise" style="--d:.95s">A set number of coffees every month, at 20+ independent cafés across Bengaluru.</p>
      </div>
      <div class="foot stack">
        <button type="submit" class="btn cta" style="--d:1.15s">${SHINE}Continue${ICON.arrow}</button>
        <div class="dots" aria-hidden="true"><span class="on"></span><span></span></div>
      </div>`;
  }

  function intro2HTML() {
    return `
      <div class="intro2-art">${ART.intro2}</div>
      <div class="intro2-copy">
        <h1 tabindex="-1" style="--base:.2s">${words('Help us')}<br>${words('shape it.', 2)}</h1>
        <p class="lede rise" style="--d:.55s">A few quick questions about how you drink coffee. No sign-up needed.</p>
        <div class="facts">
          <div class="fact" style="--i:0"><span>${ICON.clock}</span>About 2 minutes</div>
          <div class="fact" style="--i:1"><span>${ICON.lock}</span>Anonymous unless you join the waitlist</div>
        </div>
      </div>
      <div class="foot stack">
        <button type="submit" class="btn cta" style="--d:1s">${SHINE}Start${ICON.arrow}</button>
        <p class="foot-note rise" style="--d:1.2s">Your answers are only used to design Coffee Pass.</p>
        ${CONFIG.submitUrl ? '' : '<p class="preview-note">Preview mode: responses stay in this browser until submitUrl is set.</p>'}
        <div class="dots" aria-hidden="true"><span></span><span class="on"></span></div>
      </div>`;
  }

  function waitlistHTML() {
    const a = state.answers;
    const on = !!a.waitlist_consent;
    return `
      <div class="top">
        <button type="button" class="back" data-action="back" aria-label="Back">${ICON.back}</button>
        <span class="top-note">Optional · Last step</span>
      </div>
      <div class="spacer"></div>
      <div class="head">
        <h1 class="title" id="q-title" tabindex="-1">Want early access?</h1>
        <p class="sub">Join the waitlist and get an exclusive launch discount.</p>
      </div>
      <div class="opts list" style="padding-top:18px">
        <button type="button" class="opt" data-action="consent" aria-pressed="${on}">
          <span>Yes, add me to the waitlist</span>${markHTML(SQUARE)}</button>
      </div>
      <div class="fields" id="contact" ${on ? '' : 'hidden'}>
        <label class="field-label">Name
          <span class="field"><input id="c-name" type="text" data-text="name" value="${esc(a.name || '')}" placeholder="Your name"
            autocomplete="name" autocapitalize="words" maxlength="60" aria-describedby="c-name-err" enterkeyhint="next"></span>
        </label>
        <p class="field-err" id="c-name-err" role="alert"></p>
        <label class="field-label">Phone
          <span class="field"><span class="prefix">+91</span><input id="c-phone" type="tel" data-text="phone" value="${esc(a.phone || '')}"
            placeholder="XXXXX XXXXX" inputmode="numeric" autocomplete="tel-national" maxlength="16" aria-describedby="c-phone-err" enterkeyhint="next"></span>
        </label>
        <p class="field-err" id="c-phone-err" role="alert"></p>
        <div class="or" aria-hidden="true"><span></span>or<span></span></div>
        <label class="field-label">Email
          <span class="field"><input id="c-email" type="email" data-text="email" value="${esc(a.email || '')}" placeholder="you@example.com"
            inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" maxlength="100" aria-describedby="c-email-err" enterkeyhint="done"></span>
        </label>
        <p class="field-err" id="c-email-err" role="alert"></p>
        <p class="fine">Phone or email, whichever you prefer. We’ll only message you about Coffee Pass. Unsubscribe anytime.</p>
      </div>
      <p class="error" id="err" role="alert"></p>
      <div class="foot stack">
        <button type="submit" class="btn" id="submit-btn">${on ? 'Join and submit' : 'Submit'}${ICON.arrow}</button>
        <button type="button" class="text-btn block" data-action="decline" ${on ? '' : 'hidden'}>No thanks, just submit</button>
      </div>`;
  }

  function doneHTML() {
    const d = state.done || {};
    const exit = d.status === 'screened_out';
    const key = exit ? 'exit' : d.waitlist ? 'thanksList' : 'thanks';
    const copy = {
      thanks: ['Thank you.', 'Your answers will help shape Coffee Pass.'],
      thanksList: ['You’re on the list.', 'Thanks for your answers. We’ll be in touch before launch with your discount.'],
      exit: ['Thanks for<br>stopping by.', 'Coffee Pass is made for regular coffee drinkers, so we’ll stop here. Know someone who’d love it?'],
    }[key];
    return `
      ${ART[key + 'Confetti']}
      <div class="end-art pop"${exit ? '' : ' data-action="burst"'}>${ART[key]}</div>
      <div class="end-copy">
        <h1 tabindex="-1" aria-label="${copy[0].replace('<br>', ' ')}"><span aria-hidden="true">${letters(copy[0])}</span></h1>
        <p>${copy[1]}</p>
      </div>
      <div class="end-foot">
        <button type="button" class="btn cta" data-action="share">${SHINE}${ICON.share}${exit ? 'Share the survey' : 'Share with a friend'}</button>
        ${exit ? '' : '<p class="foot-note">Know someone who runs on coffee?<br>Send them the survey.</p>'}
      </div>`;
  }

  function deskHTML() {
    return `<div class="desk">
      <div class="desk-art">${ART.deskPhone}</div>
      <div class="desk-copy">
        <p class="eyebrow">Coffee Pass</p>
        <h1 tabindex="-1" style="--base:.25s;--ul:.8s"><span class="underlined">${words('Made for')}<span class="ul">${drawable(ART.deskUnderline)}</span></span><br>${words('your phone.', 2)}</h1>
        <p class="lede">This survey works best on mobile. Scan the code to open it there. It takes about 2 minutes.</p>
        <div class="desk-row">
          <div class="qr" id="qr" hidden><div class="frame">${ART.qrFrame}</div><div class="code" id="qr-code"></div></div>
          <div class="desk-actions">
            <button type="button" class="btn outline" data-action="copy">${ICON.copy}<span>Copy link</span></button>
            <button type="button" class="text-btn" data-action="continue">Continue on this screen${ICON.arrow.replace('class="arrow"', 'width="18" height="18"')}</button>
          </div>
        </div>
      </div>
    </div>`;
  }

  function screenTheme() {
    if (view === 'desk') return 'light';
    if (view === 'intro2') return 'blue';
    if (view === 'step') return STEPS[state.step].blue ? 'blue' : 'light';
    if (view === 'done') return state.done && state.done.status === 'screened_out' ? 'light' : 'blue';
    return 'light';
  }

  /* =========================================================
     Fit each screen on one phone screen, without scrolling
     ========================================================= */
  const FIT_LEVELS = 4;
  // Height the content needs, ignoring animation transforms and the footer's auto margin.
  function neededHeight(el) {
    const cs = getComputedStyle(el);
    let h = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    for (const c of el.children) {
      const s = getComputedStyle(c);
      if (s.position === 'absolute' || s.position === 'fixed' || s.display === 'none') continue;
      const autoTop = c.classList.contains('foot') || c.classList.contains('end-foot');
      h += c.offsetHeight + (autoTop ? 0 : parseFloat(s.marginTop) || 0) + (parseFloat(s.marginBottom) || 0);
    }
    return h;
  }
  function fit() {
    const el = $('#screen', app);
    if (!el) return;
    el.style.zoom = '';
    el.style.height = '';
    el.style.width = '';
    el.style.maxWidth = '';
    el.style.top = '';
    el.style.overflowY = '';
    el.style.removeProperty('--text-scale');
    el.classList.toggle('kb', kbOn);
    if (kbOn) {
      el.style.height = viewH() + 'px';
      el.style.top = (vv ? vv.offsetTop : 0) + 'px';
    }
    for (let i = 1; i <= FIT_LEVELS; i++) el.classList.remove('fit' + i);
    let level = 0;
    while (neededHeight(el) > el.clientHeight + 1 && level < FIT_LEVELS) el.classList.add('fit' + ++level);
    // Last resort on very short screens: shrink the whole screen until it fits.
    // Browsers differ in how zoom treats % and viewport units, so size it by measuring.
    for (let tries = 0; tries < 3 && neededHeight(el) > el.clientHeight + 1; tries++) {
      let z = Math.floor((parseFloat(el.style.zoom || 1) * el.clientHeight / neededHeight(el)) * 100) / 100;
      if (kbOn && z < 0.88) { // with the keyboard up, don't shrink text too far: let this screen scroll instead
        el.style.zoom = '';
        el.style.height = viewH() + 'px';
        el.style.overflowY = 'auto';
        break;
      }
      el.style.zoom = z;
      el.style.maxWidth = 'none';
      el.style.setProperty('--text-scale', String(1 / z)); // keep typed text at 16px so phones don't zoom in
      const wantW = Math.min(app.clientWidth, 440);
      const wantH = viewH();
      for (let k = 0; k < 2; k++) {
        const r = el.getBoundingClientRect();
        const cs = getComputedStyle(el);
        if (Math.abs(r.width - wantW) > 0.5) el.style.width = (parseFloat(cs.width) * wantW / r.width) + 'px';
        if (Math.abs(r.height - wantH) > 0.5) el.style.height = (parseFloat(cs.height) * wantH / r.height) + 'px';
      }
    }
  }
  const refit = () => requestAnimationFrame(fit);

  /* ---------- On-screen keyboard ---------- */
  const vv = window.visualViewport;
  let kbOn = false;
  const viewH = () => (kbOn && vv ? vv.height : window.innerHeight);
  const isTextField = (n) => !!n && (n.tagName === 'TEXTAREA' || (n.tagName === 'INPUT' && /^(text|tel|email|search)$/.test(n.type)));
  // Keep the field being typed in visible (only needed if this screen had to scroll).
  function keepFocusedVisible() {
    const el = $('#screen', app);
    const a = document.activeElement;
    if (!el || !isTextField(a) || !el.contains(a)) return;
    if (el.scrollHeight <= el.clientHeight + 1) { el.scrollTop = 0; return; }
    const er = el.getBoundingClientRect();
    const ar = (a.closest('.field-label') || a).getBoundingClientRect();
    if (ar.bottom > er.bottom - 12) el.scrollTop += ar.bottom - er.bottom + 12;
    else if (ar.top < er.top + 12) el.scrollTop -= er.top + 12 - ar.top;
  }
  let kbFrame = 0;
  function kbUpdate() {
    if (kbFrame) return;
    kbFrame = requestAnimationFrame(() => {
      kbFrame = 0;
      fit();
      keepFocusedVisible();
      if (kbOn && window.scrollY && !vv) window.scrollTo(0, 0);
    });
  }
  app.addEventListener('focusin', (e) => {
    if (!isTextField(e.target)) return;
    kbOn = true;
    kbUpdate();
    setTimeout(kbUpdate, 350); // after the keyboard has finished opening
  });
  app.addEventListener('focusout', () => {
    setTimeout(() => {
      if (isTextField(document.activeElement) && app.contains(document.activeElement)) return;
      if (!kbOn) return;
      kbOn = false;
      kbUpdate();
    }, 60);
  });
  if (vv) {
    vv.addEventListener('resize', () => { if (kbOn) kbUpdate(); });
    vv.addEventListener('scroll', () => { if (kbOn) kbUpdate(); });
  }

  let renderToken = 0;
  function render(dir = 0) {
    const token = ++renderToken;
    kbOn = false;
    const theme = screenTheme();
    document.body.dataset.theme = theme;
    document.body.dataset.view = view;
    $('#theme-color').setAttribute('content', theme === 'blue' ? '#2340D8' : '#FFFFFF');

    if (view === 'desk') {
      app.innerHTML = deskHTML();
      loadQr();
    } else {
      let inner = '';
      if (view === 'intro1') inner = intro1HTML();
      if (view === 'intro2') inner = intro2HTML();
      if (view === 'step') inner = stepHTML(STEPS[state.step], state.step);
      if (view === 'waitlist') inner = waitlistHTML();
      if (view === 'done') inner = doneHTML();
      const cls = `screen ${theme}${dir && !reducedMotion() ? ' anim' + (dir < 0 ? ' rev' : '') : ''}`;
      app.innerHTML = `<form class="${cls}" id="screen" novalidate>${inner}</form>`;
    }

    fit();
    window.scrollTo(0, 0);
    if (view === 'done' && state.done && state.done.status !== 'screened_out') {
      setTimeout(() => { if (token === renderToken) burst($('.end-art', app)); }, dir ? 650 : 400);
    }
    const h1 = $('h1', app);
    if (h1 && dir) h1.focus({ preventScroll: true });

    // Let the progress line draw from where it was.
    const fill = $('.progress .fill', app);
    if (fill) {
      const pct = +fill.dataset.pct;
      requestAnimationFrame(() => requestAnimationFrame(() => fill.setAttribute('stroke-dasharray', `${pct} 100`)));
      lastPct = pct;
    } else if (view === 'intro2' || view === 'intro1') {
      lastPct = 0;
    }
  }

  /* =========================================================
     Navigation (browser back button works too)
     ========================================================= */
  let depth = 0;
  const entry = () => ({ cp: 2, depth, view, step: state.step });

  function goTo(nextView, step, dir, mode = 'push') {
    view = nextView;
    if (nextView !== 'desk') {
      state.view = nextView;
      if (typeof step === 'number') state.step = step;
      save();
    }
    if (mode === 'push') { depth += 1; history.pushState(entry(), ''); }
    else history.replaceState(entry(), '');
    render(dir);
  }

  window.addEventListener('popstate', (e) => {
    const s = e.state;
    if (!s || s.cp !== 2) return;
    if (state.done) { // finished: stay on the thank-you screen
      view = 'done';
      history.replaceState(entry(), '');
      render(0);
      return;
    }
    const dir = order(s.view, s.step) < order(view, state.step) ? -1 : 1;
    depth = s.depth || 0;
    view = s.view;
    if (view !== 'desk') {
      state.view = view;
      state.step = Math.min(Math.max(0, s.step | 0), TOTAL - 1);
      save();
    }
    render(dir);
  });

  function next() {
    if (view === 'intro1') { goTo('intro2', null, 1); return; }
    if (view === 'intro2') {
      if (!state.startedAt) state.startedAt = Date.now();
      goTo('step', 0, 1);
      return;
    }
    if (view === 'step') {
      const s = currentStep();
      if (!validate(s)) return;
      const ends = s.opts && s.opts.some((o) => o.endsSurvey && o.label === state.answers[s.id]);
      if (ends) { finish('screened_out'); return; }
      if (state.step === TOTAL - 1) goTo('waitlist', null, 1);
      else goTo('step', state.step + 1, 1);
      return;
    }
    if (view === 'waitlist') {
      if (state.answers.waitlist_consent && !validateContact()) return;
      finish('complete');
    }
  }

  function back() {
    if (depth > 0) { history.back(); return; }
    // Resumed session with no history to go back through.
    if (view === 'waitlist') goTo('step', TOTAL - 1, -1, 'replace');
    else if (view === 'step' && state.step > 0) goTo('step', state.step - 1, -1, 'replace');
    else if (view === 'step') goTo('intro2', null, -1, 'replace');
  }

  /* =========================================================
     Validation
     ========================================================= */
  function showError(msg, shakeEl) {
    const box = $('#err', app);
    if (box) { box.textContent = ''; requestAnimationFrame(() => { box.textContent = msg; fit(); }); }
    if (shakeEl && !reducedMotion()) {
      shakeEl.classList.remove('shake');
      void shakeEl.offsetWidth;
      shakeEl.classList.add('shake');
    }
  }
  function clearError() { const box = $('#err', app); if (box && box.textContent) { box.textContent = ''; refit(); } }

  function validate(s) {
    const a = state.answers;
    if (s.kind === 'text') return true;
    if (s.kind === 'about') {
      if (!a.age || !a.occupation) {
        showError(MSG.about, $('.groups', app));
        return false;
      }
      return true;
    }
    const v = a[s.id];
    const answered = Array.isArray(v) ? v.length > 0 : !!v;
    if (!answered) {
      showError(s.multi ? MSG.multi : MSG.single, $('.opts', app));
      return false;
    }
    const other = s.opts && s.opts.find((o) => o.other);
    if (other && isSelected(s.id, other.label) && !trim(a[s.id + '_other'])) {
      const inp = $(`[data-text="${s.id}_other"]`, app);
      inp.setAttribute('aria-invalid', 'true');
      showError(MSG.other);
      inp.focus();
      return false;
    }
    return true;
  }

  function fieldError(id, msg) {
    const inp = $('#' + id, app);
    const box = $('#' + id + '-err', app);
    if (box) box.textContent = msg || '';
    if (inp) { if (msg) inp.setAttribute('aria-invalid', 'true'); else inp.removeAttribute('aria-invalid'); }
    refit();
  }

  function validateContact() {
    const a = state.answers;
    let firstBad = null;
    fieldError('c-name', ''); fieldError('c-phone', ''); fieldError('c-email', ''); clearError();
    if (!trim(a.name)) { fieldError('c-name', MSG.name); firstBad = firstBad || $('#c-name', app); }
    if (trim(a.phone) && !phoneOk(a.phone)) { fieldError('c-phone', MSG.phone); firstBad = firstBad || $('#c-phone', app); }
    if (trim(a.email) && !emailOk(a.email)) { fieldError('c-email', MSG.email); firstBad = firstBad || $('#c-email', app); }
    if (!trim(a.phone) && !trim(a.email)) {
      showError(MSG.reach);
      $('#c-phone', app).setAttribute('aria-invalid', 'true');
      $('#c-email', app).setAttribute('aria-invalid', 'true');
      firstBad = firstBad || $('#c-phone', app);
    }
    if (firstBad) { firstBad.focus(); return false; }
    return true;
  }

  /* =========================================================
     Submitting
     ========================================================= */
  function buildPayload(status) {
    const a = state.answers;
    const upto = status === 'screened_out' ? state.step : TOTAL - 1;
    const joined = status === 'complete' && !!a.waitlist_consent;
    const p = {
      response_id: state.id,
      status,
      submitted_at: new Date().toISOString(),
      started_at: state.startedAt ? new Date(state.startedAt).toISOString() : '',
      source: state.source || '',
    };
    const val = (v) => (Array.isArray(v) ? v.join('; ') : trim(v));
    STEPS.forEach((s, i) => {
      const asked = i <= upto;
      if (s.kind === 'about') {
        s.groups.forEach((g) => { p[g.id] = asked ? val(a[g.id]) : ''; });
        return;
      }
      p[s.id] = asked ? val(a[s.id]) : '';
      const other = s.opts && s.opts.find((o) => o.other);
      if (other) p[s.id + '_other'] = asked && isSelected(s.id, other.label) ? trim(a[s.id + '_other']) : '';
    });
    p.waitlist_consent = status === 'complete' ? (joined ? 'Yes' : 'No') : '';
    p.name = joined ? trim(a.name) : '';
    p.phone = joined && phoneOk(a.phone) ? '+91' + normPhone(a.phone) : '';
    p.email = joined && emailOk(a.email) ? trim(a.email) : '';
    return p;
  }

  function finish(status) {
    const payload = buildPayload(status);
    send(payload);
    state.done = { status, at: Date.now(), waitlist: payload.waitlist_consent === 'Yes' };
    shareName = payload.name.replace(/\s+/g, ' ').slice(0, 40);
    state.answers = {}; // don't keep personal details on the device once sent
    goTo('done', null, 1, 'replace');
  }

  function queue(payload) {
    const q = store.get(CONFIG.outboxKey) || [];
    q.push(payload);
    store.set(CONFIG.outboxKey, q.slice(-20));
  }

  async function send(payload) {
    if (!CONFIG.submitUrl) {
      const list = store.get(CONFIG.localResponsesKey) || [];
      list.push(payload);
      store.set(CONFIG.localResponsesKey, list.slice(-50));
      console.info('[Coffee Pass] submitUrl is not set, so this response was only saved in this browser:', payload);
      return;
    }
    try {
      // text/plain + no-cors keeps this a "simple" request that Google Apps Script accepts.
      await fetch(CONFIG.submitUrl, {
        method: 'POST',
        mode: 'no-cors',
        keepalive: true,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
      });
    } catch (err) {
      queue(payload); // offline or blocked: retry on the next visit
    }
  }

  async function flushOutbox() {
    if (!CONFIG.submitUrl) return;
    const q = store.get(CONFIG.outboxKey) || [];
    if (!q.length) return;
    store.del(CONFIG.outboxKey);
    for (const p of q) await send(p);
  }

  /* =========================================================
     Confetti
     ========================================================= */
  const CONFETTI_COLORS = ['#FFFFFF', '#FFFFFF', '#DCE1F5', '#B9C2EC', '#8FA0F0', '#F3F5FE'];
  let confettiCanvas = null;
  let confettiParts = [];
  let confettiRaf = 0;

  function sizeConfetti() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    confettiCanvas.width = innerWidth * dpr;
    confettiCanvas.height = innerHeight * dpr;
    confettiCanvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function spawn(x, y, angle, speed) {
    const r = Math.random();
    confettiParts.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 6 + Math.random() * 6,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.3,
      shape: r < 0.3 ? 'bean' : r < 0.75 ? 'strip' : 'dot',
      color: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0],
      life: 0,
      ttl: 150 + Math.random() * 90,
      flip: Math.random() * 10,
    });
    if (!confettiRaf) confettiRaf = requestAnimationFrame(tickConfetti);
  }

  function burst(origin, power = 1) {
    if (reducedMotion() || !origin) return;
    if (!confettiCanvas) {
      confettiCanvas = document.createElement('canvas');
      confettiCanvas.className = 'confetti-canvas';
      confettiCanvas.setAttribute('aria-hidden', 'true');
      document.body.appendChild(confettiCanvas);
      sizeConfetti();
    }
    const r = origin.getBoundingClientRect();
    const ox = r.left + r.width / 2;
    const oy = r.top + r.height / 2;
    const k = 0.6 + Math.min(1, innerWidth / 600) * 0.4; // gentler on phones
    const speed = k * (0.65 + 0.35 * power);
    for (let i = 0; i < Math.round(120 * power); i++) spawn(ox, oy, -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.2, (7 + Math.random() * 9) * speed);
    if (power < 1) return;
    setTimeout(() => {
      for (let i = 0; i < 45; i++) spawn(-10, innerHeight * 0.8, -Math.PI / 3 + (Math.random() - 0.5) * 0.7, (11 + Math.random() * 8) * k);
      for (let i = 0; i < 45; i++) spawn(innerWidth + 10, innerHeight * 0.8, (-2 * Math.PI) / 3 + (Math.random() - 0.5) * 0.7, (11 + Math.random() * 8) * k);
    }, 260);
  }

  function tickConfetti() {
    const ctx = confettiCanvas.getContext('2d');
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    confettiParts = confettiParts.filter((p) => p.life < p.ttl && p.y < innerHeight + 40);
    for (const p of confettiParts) {
      p.life += 1;
      p.vy += 0.22;
      p.vx *= 0.986;
      p.vy *= 0.986;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, (p.ttl - p.life) / 40));
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === 'strip') {
        ctx.scale(1, Math.cos(p.life * 0.18 + p.flip));
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      } else if (p.shape === 'dot') {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 3, 0, Math.PI * 2);
        ctx.fill();
      } else { // coffee bean
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size * 0.42, p.size * 0.6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(35, 64, 216, 0.45)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(0, -p.size * 0.5);
        ctx.quadraticCurveTo(p.size * 0.22, 0, 0, p.size * 0.5);
        ctx.stroke();
      }
      ctx.restore();
    }
    confettiRaf = confettiParts.length ? requestAnimationFrame(tickConfetti) : 0;
  }
  window.addEventListener('resize', () => { if (confettiCanvas) sizeConfetti(); });

  /* =========================================================
     Sharing, copy link, QR code
     ========================================================= */
  async function share() {
    // The sharer's name becomes the new respondent's `source`, so referrals are traceable.
    const url = surveyUrl(shareName || 'share');
    const text = 'I just took a 2-minute survey about Coffee Pass, a coffee subscription for Bengaluru’s independent cafés. Take it too:';
    if (navigator.share) {
      try {
        await navigator.share({ title: 'Coffee Pass survey', text, url });
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }
    }
    window.open('https://wa.me/?text=' + encodeURIComponent(text + ' ' + url), '_blank', 'noopener');
  }

  async function copyLink(btn) {
    const url = surveyUrl(state.source);
    let ok = false;
    try { await navigator.clipboard.writeText(url); ok = true; } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = url; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      ta.remove();
    }
    const label = $('span', btn);
    label.textContent = ok ? 'Link copied' : url;
    setTimeout(() => { if (label.isConnected) label.textContent = 'Copy link'; }, 2200);
  }

  function drawQr() {
    const box = $('#qr-code', app);
    if (!box || typeof window.qrcode !== 'function') return;
    const qr = window.qrcode(0, 'M');
    qr.addData(surveyUrl(state.source));
    qr.make();
    const n = qr.getModuleCount();
    let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
    box.innerHTML = `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="QR code that opens the survey on your phone"><path d="${d}" fill="#0E1330"/></svg>`;
    $('#qr', app).hidden = false;
  }
  let qrLoading = false;
  function loadQr() {
    if (typeof window.qrcode === 'function') { drawQr(); return; }
    if (qrLoading) return;
    qrLoading = true;
    const sc = document.createElement('script');
    sc.src = CONFIG.qrLib;
    sc.async = true;
    sc.onload = drawQr; // if it fails, the Copy link button still works
    document.head.appendChild(sc);
  }

  /* =========================================================
     Events
     ========================================================= */
  function syncField(field) {
    $$(`[data-field="${field}"] .opt`, app).forEach((b) => {
      const sel = String(isSelected(field, b.dataset.value));
      b.setAttribute(b.hasAttribute('aria-pressed') ? 'aria-pressed' : 'aria-checked', sel);
    });
  }

  function pick(btn) {
    const group = btn.closest('[data-field]');
    const field = group.dataset.field;
    const multi = group.dataset.multi === 'true';
    const value = btn.dataset.value;
    const s = currentStep();
    const a = state.answers;
    clearError();

    if (!multi) {
      a[field] = value;
    } else {
      const opts = s.opts || [];
      let list = Array.isArray(a[field]) ? a[field].slice() : [];
      const opt = opts.find((o) => o.label === value) || {};
      if (list.includes(value)) {
        list = list.filter((x) => x !== value);
      } else {
        if (opt.exclusive) list = [];
        else list = list.filter((x) => !(opts.find((o) => o.label === x) || {}).exclusive);
        if (s.max && list.length >= s.max) {
          showError(MSG.max(s.max), group);
          return;
        }
        list.push(value);
      }
      a[field] = list;
    }
    syncField(field);
    if (isSelected(field, value)) {
      btn.classList.remove('pop');
      void btn.offsetWidth;
      btn.classList.add('pop');
      btn.addEventListener('animationend', (ev) => { if (ev.target === btn) btn.classList.remove('pop'); }, { once: true });
    }

    if (s) {
      const other = s.opts && s.opts.find((o) => o.other);
      if (other) {
        const wrap = $(`[data-other-for="${s.id}"]`, app);
        const show = isSelected(s.id, other.label);
        if (wrap) {
          wrap.hidden = !show;
          if (show && value === other.label) $('input', wrap).focus();
        }
      }
      if (s.hint) {
        const h = $('#hint', app);
        const t = hintText();
        h.hidden = !t;
        $('p', h).innerHTML = t;
      }
      refit();
    }
    save();
  }

  app.addEventListener('submit', (e) => {
    e.preventDefault();
    next();
  });

  app.addEventListener('click', (e) => {
    const action = e.target.closest('[data-action]');
    if (action) {
      const act = action.dataset.action;
      if (act === 'back') back();
      if (act === 'skip') { delete state.answers.cafe_suggestions; goTo('step', state.step + 1, 1); }
      if (act === 'share') share();
      if (act === 'burst') burst(action, 0.6);
      if (act === 'tap-card') {
        action.classList.remove('tapped');
        void action.offsetWidth;
        action.classList.add('tapped');
      }
      if (act === 'copy') copyLink(action);
      if (act === 'continue') goTo(state.done ? 'done' : state.view, state.step, 1); // back to where they were
      if (act === 'consent') {
        const on = !state.answers.waitlist_consent;
        state.answers.waitlist_consent = on;
        action.setAttribute('aria-pressed', String(on));
        $('#contact', app).hidden = !on;
        $('[data-action="decline"]', app).hidden = !on;
        $('#submit-btn', app).innerHTML = (on ? 'Join and submit' : 'Submit') + ICON.arrow;
        clearError();
        fit();
        save();
        if (on && !trim(state.answers.name)) $('#c-name', app).focus();
      }
      if (act === 'decline') { state.answers.waitlist_consent = false; finish('complete'); }
      return;
    }
    const opt = e.target.closest('.opt[data-value]');
    if (opt) pick(opt);
  });

  app.addEventListener('input', (e) => {
    const t = e.target;
    const key = t.dataset && t.dataset.text;
    if (!key) return;
    state.answers[key] = t.value;
    if (t.getAttribute('aria-invalid') === 'true') {
      const fixed = key === 'name' ? !!trim(t.value)
        : key === 'phone' ? !trim(t.value) || phoneOk(t.value)
        : key === 'email' ? !trim(t.value) || emailOk(t.value)
        : !!trim(t.value);
      if (fixed) {
        t.removeAttribute('aria-invalid');
        const box = $('#' + t.id + '-err', app);
        if (box && box.textContent) { box.textContent = ''; refit(); }
      }
    }
    if ((key === 'phone' || key === 'email') && trim(t.value)) {
      clearError();
      $$('#c-phone, #c-email', app).forEach((inp) => { if (!trim(inp.value) || inp === t) inp.removeAttribute('aria-invalid'); });
    }
    if (key.endsWith('_other') && trim(t.value)) clearError();
    saveSoon();
  });

  app.addEventListener('focusout', (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.text === 'phone' && phoneOk(t.value)) {
      t.value = fmtPhone(normPhone(t.value));
      state.answers.phone = t.value;
      saveSoon();
    }
  });

  window.addEventListener('pagehide', save);
  // Re-fit on rotation or window resize, but not while the keyboard is open for typing.
  window.addEventListener('resize', () => {
    if (kbOn) { kbUpdate(); return; }
    refit();
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
  window.addEventListener('online', flushOutbox);

  /* =========================================================
     Start
     ========================================================= */
  const params = new URLSearchParams(location.search);
  if (params.has('reset')) {
    params.delete('reset');
    store.del(CONFIG.storageKey);
    state = freshState();
    view = 'intro1';
    const qs = params.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
  }

  // On a laptop or desktop, always open on "Made for your phone" (skip with ?mobile).
  const desktop = window.matchMedia('(min-width: 768px) and (hover: hover) and (pointer: fine)').matches;
  if (desktop && !params.has('mobile')) view = 'desk';

  history.replaceState(entry(), '');
  render(0);
  flushOutbox();
})();
</script>
</body>
</html>
